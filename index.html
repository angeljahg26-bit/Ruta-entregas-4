function LiquidadorView({ name, onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [showPrevious, setShowPrevious] = useState(false);
  const [activeInvoice, setActiveInvoice] = useState(null);
  const [showExport, setShowExport] = useState(false);

  useEffect(() => {
    const unwatch = window.storage.watch(INDEX_KEY, (raw) => {
      setIndex(parseIndexSnapshot(raw));
    });
    return unwatch;
  }, []);
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);

  async function saveLiquidacion(status, motivo, attachment, location) {
    // attachment: null = sin cambios en el archivo adjunto (o ninguno);
    // {dataUrl,name,type} = archivo nuevo — la foto/documento se guarda
    // aparte de la ruta, y en route.liquidacion solo queda su nombre/tipo.
    let attachmentMeta = route.liquidacion?.attachment || null;
    let legacyPhoto = route.liquidacion?.photo || null; // compat con datos de antes de esta versión
    if (attachment) {
      await savePhoto(`liq-${route.id}`, attachment.dataUrl);
      attachmentMeta = { name: attachment.name, type: attachment.type };
      legacyPhoto = null; // ya quedó en el formato nuevo (separado de la ruta)
    }
    const updated = { ...route, liquidacion: { status, motivo: motivo || "", attachment: attachmentMeta, photo: legacyPhoto, location: location || null, by: name, updatedAt: Date.now() } };
    await saveRoute(updated);
    setRoute(updated);
    await patchIndexEntry(updated.id, { liquidacionStatus: status });
  }

  async function saveInvoiceLiq(invoiceId, payload) {
    const { attachment, ...fields } = payload;
    if (attachment) await savePhoto(`liqinv-${invoiceId}`, attachment.dataUrl);
    const current = route.invoices.find((inv) => inv.id === invoiceId);
    const liqHasAttachment = !!attachment || (fields.liqStatus === "no_liquidado" && !!current?.liqHasAttachment);
    const updated = {
      ...route,
      invoices: route.invoices.map((inv) =>
        inv.id === invoiceId
          ? {
              ...inv,
              liqStatus: fields.liqStatus,
              liqMotivo: fields.liqStatus === "liquidado" ? null : fields.liqMotivo || null,
              liqComment: fields.liqStatus === "liquidado" ? null : fields.liqComment || null,
              liqRuta: fields.liqStatus === "liquidado" ? null : fields.liqRuta || null,
              liqOperador: fields.liqStatus === "liquidado" ? null : fields.liqOperador || null,
              liqHasAttachment: fields.liqStatus === "liquidado" ? false : liqHasAttachment,
              liqBy: name,
              liqAt: Date.now(),
            }
          : inv
      ),
    };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await patchIndexEntry(route.id, liqCounts(updated.invoices));
    setActiveInvoice(null);
  }

  if (route) {
    const fallidas = route.invoices.filter((i) => i.status === "fallido");
    const conFaltante = route.invoices.filter((i) => i.status === "entregado" && i.faltante);
    return (
      <div className="lg-root min-h-screen">
        <GlobalStyle />
        <Header title={route.name} subtitle={`Chofer: ${route.driverName}`} onBack={() => setSelectedId(null)} dark />
        <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-4">
          <div className="lg-card p-4">
            <ProgressBar invoices={route.invoices} />
            <div className="mt-2.5">
              <LiquidacionSummaryTag total={route.invoices.length} {...liqCounts(route.invoices)} />
            </div>
          </div>

          {fallidas.length > 0 && (
            <div>
              <h2 className="font-semibold mb-2">Devoluciones ({fallidas.length})</h2>
              <div className="flex flex-col gap-2.5">
                {groupByClient(fallidas).map((inv) => (
                  <div key={inv.id} className="lg-card p-3.5">
                    <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(inv)}</p>
                    <p className="font-semibold">{inv.cliente}</p>
                    {isRecoleccion(inv) && <div className="mt-1 mb-1"><RecoleccionTag /></div>}
                    {inv.comment && (
                      <p className="text-sm mt-1 rounded-md p-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
                        {inv.comment}
                      </p>
                    )}
                    {(inv.hasPhoto || inv.photo) ? (
                      <div className="mt-2 flex items-center gap-3 flex-wrap">
                        <EvidenceButton photoId={inv.id} inlineSrc={inv.photo || null} label="Ver formato" downloadName={`devolucion_${invoiceFileTag(inv)}.jpg`} />
                        {inv.location && (
                          <a href={mapsLink(inv.location)} target="_blank" rel="noreferrer" className="text-xs font-medium underline" style={{ color: "var(--brand)" }}>
                            Ver ubicación
                          </a>
                        )}
                        <span className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{formatDateTime(inv.updatedAt)}</span>
                      </div>
                    ) : (
                      <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>Sin foto de devolución adjunta.</p>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {conFaltante.length > 0 && (
            <div>
              <h2 className="font-semibold mb-2">Entregas con faltante ({conFaltante.length})</h2>
              <div className="flex flex-col gap-2.5">
                {conFaltante.map((inv) => (
                  <div key={inv.id} className="lg-card p-3.5">
                    <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(inv)}</p>
                    <p className="font-semibold">{inv.cliente}</p>
                    <p className="text-sm mt-1 rounded-md p-2" style={{ background: "var(--warn-bg)", color: "var(--warn)" }}>
                      <AlertTriangle size={13} className="inline mr-1 -mt-0.5" />{inv.incidencia || "sin detalle"}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div>
            <h2 className="font-semibold mb-2">Facturas — liquidar una por una ({route.invoices.length})</h2>
            <div className="flex flex-col gap-2.5">
              {route.invoices.length === 0 && <EmptyState text="Esta ruta todavía no tiene facturas." />}
              {groupByClient(route.invoices).map((inv) => (
                <div key={inv.id} className="lg-card p-3.5">
                  <div
                    className="flex items-start justify-between gap-2 cursor-pointer"
                    role="button" tabIndex={0}
                    onClick={() => setActiveInvoice(inv)}
                    onKeyDown={(e) => { if (e.key === "Enter") setActiveInvoice(inv); }}
                  >
                    <div className="min-w-0">
                      <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(inv)}</p>
                      <p className="font-semibold truncate">{inv.cliente}</p>
                      {isRecoleccion(inv) && <div className="mt-1"><RecoleccionTag /></div>}
                    </div>
                    <div className="flex flex-col items-end gap-1.5 shrink-0">
                      <StatusPill status={inv.status} />
                      <LiqStatusPill status={inv.liqStatus || "pendiente"} />
                    </div>
                  </div>
                  <LiqDetailBlock inv={inv} />
                </div>
              ))}
            </div>
          </div>

          {activeInvoice && (
            <LiquidacionInvoiceSheet
              invoice={activeInvoice}
              onCancel={() => setActiveInvoice(null)}
              onConfirm={(payload) => saveInvoiceLiq(activeInvoice.id, payload)}
            />
          )}

          <LiquidacionForm route={route} onSave={saveLiquidacion} />
        </div>
      </div>
    );
  }

  const todayRoutes = index.filter((r) => isToday(r.createdAt));
  const previousRoutes = index.filter((r) => !isToday(r.createdAt));
  const { dayGroups, weekGroups } = groupPreviousRoutes(previousRoutes);

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title="Liquidación de rutas" subtitle={`Hola, ${name}`} onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-3">
        <button type="button" className="lg-btn lg-btn-ghost w-full mb-1" onClick={() => setShowExport(true)}>
          <FileSpreadsheet size={16} /> Exportar liquidación a Excel
        </button>
        {showExport && <ExportLiquidacionSheet index={index} onCancel={() => setShowExport(false)} />}

        <h2 className="font-semibold mb-1">Rutas de hoy</h2>
        {todayRoutes.length === 0 && <EmptyState text="Sin rutas hoy todavía." />}
        {todayRoutes.map((r) => (
          <RouteRow key={r.id} r={r} onClick={() => setSelectedId(r.id)} />
        ))}

        {previousRoutes.length > 0 && (
          <div className="mt-3">
            <button type="button" className="lg-btn lg-btn-ghost w-full" onClick={() => setShowPrevious((v) => !v)}>
              {showPrevious ? "Ocultar" : "Mostrar"} rutas anteriores ({previousRoutes.length})
            </button>
            {showPrevious && (
              <div className="flex flex-col gap-2.5 mt-3">
                {dayGroups.map(([key, group]) => (
                  <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                ))}
                {weekGroups.map(([key, group]) => (
                  <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function LiquidacionForm({ route, onSave }) {
  const [status, setStatus] = useState(route.liquidacion?.status || "pendiente");
  const [motivo, setMotivo] = useState(route.liquidacion?.motivo || "");
  // Archivo nuevo elegido en esta sesión (con dataUrl en memoria, aún no
  // subido). El adjunto ya guardado NO se precarga — solo se conocen su
  // nombre/tipo (metadatos livianos); el archivo en sí se pide bajo
  // demanda con EvidenceButton, para no bajarlo solo por abrir la ruta.
  const [attachment, setAttachment] = useState(null);
  const existingMeta = route.liquidacion?.attachment || null;
  const legacyInlinePhoto = route.liquidacion?.photo || null; // datos de antes de esta versión
  const [location, setLocation] = useState(route.liquidacion?.location || null);
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(false);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      window.alert("El archivo pesa más de 8 MB. Usa uno más ligero (por ejemplo, comprime el PDF o toma la foto con menor calidad).");
      return;
    }
    setBusy(true);
    try {
      const isImage = file.type.startsWith("image/");
      const [dataUrl, loc] = await Promise.all([
        isImage ? compressImage(file) : readAsDataURL(file),
        getLocation(),
      ]);
      setAttachment({ dataUrl, name: file.name, type: file.type || "application/octet-stream" });
      setLocation(loc);
    } finally {
      setBusy(false);
    }
  }

  async function save() {
    setBusy(true);
    try {
      await onSave(status, motivo, attachment, location);
      setSaved(true);
      setTimeout(() => setSaved(false), 2500);
    } finally {
      setBusy(false);
    }
  }

  const isImageAttachment = attachment?.type?.startsWith("image/");
  const hasAnyAttachment = !!(attachment || existingMeta || legacyInlinePhoto);

  return (
    <div className="lg-card p-4 flex flex-col gap-3">
      <h2 className="font-semibold">Estatus de liquidación</h2>
      <div className="flex gap-2">
        <button type="button" className={`lg-btn flex-1 ${status === "pendiente" ? "lg-btn-dark" : "lg-btn-ghost"}`} onClick={() => setStatus("pendiente")}>
          Pendiente
        </button>
        <button type="button" className={`lg-btn flex-1 ${status === "liquidado" ? "lg-btn-ok" : "lg-btn-ghost"}`} onClick={() => setStatus("liquidado")}>
          Liquidado
        </button>
      </div>
      <div>
        <label className="text-sm font-medium">Motivo / notas (opcional)</label>
        <textarea className="lg-input mt-1" rows={3} value={motivo} onChange={(e) => setMotivo(e.target.value)}
          placeholder="Ej. faltó una devolución por firmar…" />
      </div>
      <div>
        <label className="text-sm font-medium block mb-1">Archivo adjunto (opcional) — foto, PDF u otro documento</label>
        {attachment ? (
          isImageAttachment ? (
            <img src={attachment.dataUrl} alt="evidencia liquidación" className="rounded-lg w-full max-h-48 object-cover" />
          ) : (
            <div className="lg-card p-3 flex items-center gap-3">
              <FileIcon size={22} style={{ color: "var(--muted)" }} />
              <div className="min-w-0">
                <p className="text-sm font-medium truncate">{attachment.name}</p>
                <p className="text-xs" style={{ color: "var(--muted)" }}>{attachment.type}</p>
              </div>
            </div>
          )
        ) : legacyInlinePhoto ? (
          <img src={legacyInlinePhoto} alt="evidencia liquidación" className="rounded-lg w-full max-h-48 object-cover" />
        ) : existingMeta ? (
          <div className="lg-card p-3 flex items-center gap-3">
            <FileIcon size={22} style={{ color: "var(--muted)" }} />
            <div className="min-w-0 flex-1">
              <p className="text-sm font-medium truncate">{existingMeta.name}</p>
              <p className="text-xs" style={{ color: "var(--muted)" }}>{existingMeta.type}</p>
            </div>
            <EvidenceButton photoId={`liq-${route.id}`} mimeType={existingMeta.type} label="Ver" downloadName={existingMeta.name} />
          </div>
        ) : (
          <label className="lg-card flex flex-col items-center justify-center gap-2 py-6 cursor-pointer" style={{ borderStyle: "dashed" }}>
            <Upload size={22} style={{ color: "var(--muted)" }} />
            <span className="text-sm font-medium">Subir foto, PDF u otro archivo</span>
            <input type="file" className="lg-file-input" onChange={handleFile} />
          </label>
        )}
        {hasAnyAttachment && (
          <label className="text-sm font-medium underline cursor-pointer mt-1 inline-block" style={{ color: "var(--brand)" }}>
            Cambiar archivo
            <input type="file" className="lg-file-input" onChange={handleFile} />
          </label>
        )}
        {attachment && (
          <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>
            {location ? "📍 Ubicación capturada junto con el archivo." : "Sin ubicación disponible para este archivo."}
          </p>
        )}
      </div>
      <button className="lg-btn lg-btn-brand" disabled={busy} onClick={save}>
        {busy ? "Guardando…" : saved ? "Guardado ✓" : "Guardar estatus"}
      </button>
    </div>
  );
}

function DriverView({ driverName, onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [activeInvoice, setActiveInvoice] = useState(null); // {invoice, action}
  const [showPrevious, setShowPrevious] = useState(false);

  const myRoutes = index.filter(
    (r) => r.driverName.trim().toLowerCase() === driverName.trim().toLowerCase()
  );
  const myTodayRoutes = myRoutes.filter((r) => isToday(r.createdAt));

  // Pide al servidor SOLO las rutas de este chofer (orderByChild +
  // equalTo), en vez de recibir la lista completa de todas las rutas de
  // todos y filtrar aquí — así, cuando otro chofer marca una entrega,
  // este celular ni se entera (Firebase nunca se lo manda).
  // Resguardo: si routes-index todavía no se migró al formato nuevo
  // (bloque de texto viejo en vez de una ruta por hijo), la consulta no
  // puede filtrar del lado del servidor — en ese caso, esta pantalla
  // sola se cambia a escuchar todo y filtrar aquí, como antes, hasta
  // que alguien corra el mantenimiento del índice en Despacho.
  useEffect(() => {
    const myKey = driverKey(driverName);
    let unwatch = null;
    let usingFallback = false;
    function startFallback() {
      usingFallback = true;
      unwatch = window.storage.watch(INDEX_KEY, (raw) => {
        setIndex(parseIndexSnapshot(raw));
      });
    }
    unwatch = window.storage.watchQuery(
      INDEX_KEY,
      (ref) => ref.orderByChild("driverKey").equalTo(myKey),
      (raw) => {
        if (!usingFallback && typeof raw === "string") {
          if (unwatch) unwatch();
          startFallback();
          return;
        }
        setIndex(parseIndexSnapshot(raw));
      }
    );
    return () => { if (unwatch) unwatch(); };
  }, [driverName]);
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);

  async function submitStatus(invoiceId, status, extra) {
    // La foto NUNCA va dentro del objeto de la ruta: si viviera ahí,
    // cada cambio de estatus de CUALQUIER factura obligaría a todos los
    // que tienen esa ruta abierta a re-descargar TODAS sus fotos (RTDB
    // sincroniza el nodo completo ante cualquier cambio de un hijo). Se
    // sube aparte, y en la factura solo queda un booleano.
    const { photo, ...rest } = extra;
    if (photo) await savePhoto(invoiceId, photo);
    const updated = {
      ...route,
      invoices: route.invoices.map((inv) =>
        inv.id === invoiceId ? { ...inv, status, ...rest, hasPhoto: !!photo, updatedAt: Date.now() } : inv
      ),
    };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await patchIndexEntry(route.id, routeCounts(updated.invoices));
    setActiveInvoice(null);
  }

  if (route) {
    return (
      <div className="lg-root min-h-screen">
        <GlobalStyle />
        <Header title={route.name} subtitle={`${route.invoices.length} entregas`} onBack={() => (myRoutes.length > 1 ? setSelectedId(null) : onExit())} dark />
        <div className="max-w-lg mx-auto px-4 py-5">
          <div className="lg-card p-4 mb-5">
            <ProgressBar invoices={route.invoices} />
          </div>

          <div className="flex flex-col gap-3">
            {route.invoices.length === 0 && <EmptyState text="Despacho aún no agrega facturas a tu ruta." />}
            {route.invoices.map((inv, idx) => (
              <button
                key={inv.id}
                onClick={() => setActiveInvoice(inv)}
                className="lg-card p-4 text-left w-full active:scale-[0.99] transition-transform"
                style={{ borderLeft: `6px solid ${STATUS[inv.status].fg === "var(--muted)" ? "var(--line)" : STATUS[inv.status].fg}` }}
              >
                <div className="flex items-start justify-between gap-2">
                  <div className="flex items-start gap-2.5 min-w-0">
                    <span
                      className="lg-mono text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center shrink-0 mt-0.5"
                      style={{ background: "var(--paper)", color: "var(--muted)", border: "1.5px solid var(--line)" }}
                    >
                      {idx + 1}
                    </span>
                    <div className="min-w-0">
                      <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(inv)}</p>
                      <p className="font-semibold text-base truncate">{inv.cliente}</p>
                      <p className="text-sm truncate" style={{ color: "var(--muted)" }}>
                        <MapPin size={12} className="inline mr-1 -mt-0.5" />{inv.direccion}
                      </p>
                      {isRecoleccion(inv) && <div className="mt-1"><RecoleccionTag /></div>}
                    </div>
                  </div>
                  <StatusPill status={inv.status} />
                </div>
                {inv.status === "entregado" && inv.faltante && (
                  <p className="text-xs mt-2 rounded-md p-1.5" style={{ background: "var(--warn-bg)", color: "var(--warn)" }}>
                    <AlertTriangle size={12} className="inline mr-1 -mt-0.5" />Reportaste faltante
                  </p>
                )}
              </button>
            ))}
          </div>
        </div>

        {activeInvoice && (
          <InvoiceActionSheet
            invoice={activeInvoice}
            onCancel={() => setActiveInvoice(null)}
            onConfirm={submitStatus}
          />
        )}
      </div>
    );
  }

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title={`Hola, ${driverName}`} subtitle="Tus rutas de hoy" onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-3">
        {myRoutes.length === 0 && <EmptyState text="Todavía no tienes rutas asignadas. Pide a despacho que te asigne una." />}
        {myTodayRoutes.map((r) => (
          <button key={r.id} onClick={() => setSelectedId(r.id)} className="lg-card p-4 text-left w-full flex items-center gap-3">
            <div className="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--brand-light)" }}>
              <Truck size={20} color="var(--dark)" />
            </div>
            <div className="min-w-0">
              <p className="font-semibold truncate">{r.name}</p>
              <p className="text-xs" style={{ color: "var(--muted)" }}>Toca para ver tus entregas</p>
            </div>
          </button>
        ))}
        {(() => {
          const previousRoutes = myRoutes.filter((r) => !isToday(r.createdAt));
          if (previousRoutes.length === 0) return null;
          return (
            <div className="mt-1">
              <button type="button" className="lg-btn lg-btn-ghost w-full" onClick={() => setShowPrevious((v) => !v)}>
                {showPrevious ? "Ocultar" : "Mostrar"} rutas anteriores ({previousRoutes.length})
              </button>
              {showPrevious && (
                <div className="flex flex-col gap-3 mt-3">
                  {previousRoutes.slice().sort((a, b) => b.createdAt - a.createdAt).map((r) => (
                    <button key={r.id} onClick={() => setSelectedId(r.id)} className="lg-card p-4 text-left w-full flex items-center gap-3">
                      <div className="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--brand-light)" }}>
                        <Truck size={20} color="var(--dark)" />
                      </div>
                      <div className="min-w-0">
                        <p className="font-semibold truncate">{r.name}</p>
                        <p className="text-xs" style={{ color: "var(--muted)" }}>{routeDateLabel(r.createdAt)}</p>
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          );
        })()}
      </div>
    </div>
  );
}

const LIQ_STATUS = {
  pendiente: { label: "Pendiente", bg: "var(--pend-bg)", fg: "var(--muted)", border: "var(--line)" },
  liquidado: { label: "Liquidado", bg: "var(--ok-bg)", fg: "var(--ok)", border: "var(--ok)" },
  no_liquidado: { label: "No liquidado", bg: "var(--bad-bg)", fg: "var(--bad)", border: "var(--bad)" },
};
function LiqStatusPill({ status }) {
  const s = LIQ_STATUS[status] || LIQ_STATUS.pendiente;
  const Icon = status === "liquidado" ? CheckCircle2 : status === "no_liquidado" ? XCircle : Clock;
  return (
    <span
      style={{ background: s.bg, color: s.fg, border: `1.5px solid ${s.border}` }}
      className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full"
    >
      <Icon size={13} /> {s.label}
    </span>
  );
}

/* Hoja para liquidar una factura: "Liquidado" guarda directo; "No
   liquidado" obliga a escribir un comentario antes de poder guardar. */
function ExportLiquidacionSheet({ index, onCancel }) {
  const todayStr = new Date().toISOString().slice(0, 10);
  const [from, setFrom] = useState(todayStr);
  const [to, setTo] = useState(todayStr);
  const [busy, setBusy] = useState(false);

  function setPreset(days) {
    const now = new Date();
    const start = new Date(now);
    start.setDate(now.getDate() - (days - 1));
    setFrom(start.toISOString().slice(0, 10));
    setTo(now.toISOString().slice(0, 10));
  }

  async function doExport() {
    setBusy(true);
    try {
      const { count } = await exportLiquidacionExcel(from, to, index);
      if (count === 0) window.alert("No se encontraron facturas en ese rango de fechas.");
      else onCancel();
    } catch (err) {
      window.alert("No se pudo exportar: " + (err && err.message ? err.message : err));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Exportar a Excel</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>
        <div className="flex flex-col gap-3">
          <div className="flex gap-2">
            <button type="button" className="lg-btn lg-btn-ghost flex-1 !py-2 text-xs" onClick={() => setPreset(1)}>Hoy</button>
            <button type="button" className="lg-btn lg-btn-ghost flex-1 !py-2 text-xs" onClick={() => setPreset(7)}>Últimos 7 días</button>
            <button type="button" className="lg-btn lg-btn-ghost flex-1 !py-2 text-xs" onClick={() => setPreset(30)}>Últimos 30 días</button>
          </div>
          <div>
            <label className="text-sm font-medium">Desde</label>
            <input type="date" className="lg-input mt-1" value={from} max={to} onChange={(e) => setFrom(e.target.value)} />
          </div>
          <div>
            <label className="text-sm font-medium">Hasta</label>
            <input type="date" className="lg-input mt-1" value={to} min={from} onChange={(e) => setTo(e.target.value)} />
          </div>
          <p className="text-xs" style={{ color: "var(--muted)" }}>
            Se incluyen todas las facturas de las rutas creadas en ese rango, con su estatus de entrega y de liquidación.
          </p>
          <button className="lg-btn lg-btn-brand" disabled={busy || !from || !to} onClick={doExport}>
            {busy ? "Generando…" : "Exportar"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* Catálogo de motivos para cuando una factura NO queda liquidada.
   needsRoute: pide ruta + operador a mano (texto libre, no hay catálogo
   de rutas todavía). needsAttachment: pide adjuntar el formato de
   devolución. needsComment: el motivo en sí es "Otro", así que el
   comentario libre ES la explicación (obligatorio). */
const LIQ_MOTIVOS = [
  { value: "otra_ruta", label: "Se entregó en otra ruta", needsRoute: true, needsAttachment: false, needsComment: false },
  { value: "cerrado", label: "Cerrado", needsRoute: false, needsAttachment: true, needsComment: false },
  { value: "rechazo", label: "Cliente rechazó el pedido", needsRoute: false, needsAttachment: true, needsComment: false },
  { value: "rv_cancelo", label: "RV canceló entrega", needsRoute: false, needsAttachment: true, needsComment: false },
  { value: "otro", label: "Otro (escribir motivo)", needsRoute: false, needsAttachment: false, needsComment: true },
];
function liqMotivoLabel(value) {
  return LIQ_MOTIVOS.find((m) => m.value === value)?.label || value || "";
}

/* Detalle de la liquidación de una factura, para mostrar en Admin,
   Liquidación o Ventas: motivo, ruta/operador si aplica, el formato de
   devolución adjunto, y quién la liquidó y cuándo (para que Despacho
   pueda ver quién hizo cada movimiento). */
function LiqDetailBlock({ inv }) {
  if (!inv.liqStatus || inv.liqStatus === "pendiente") return null;
  const who = (inv.liqBy || inv.liqAt) && (
    <p className="text-xs mt-1" style={{ color: inv.liqStatus === "liquidado" ? "var(--muted)" : "var(--bad)" }}>
      {inv.liqBy || "—"}{inv.liqAt ? ` · ${formatDateTime(inv.liqAt)}` : ""}
    </p>
  );
  if (inv.liqStatus === "liquidado") {
    return <div className="mt-2">{who}</div>;
  }
  return (
    <div className="text-sm mt-2 rounded-md p-2 flex flex-col gap-1" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
      {inv.liqMotivo && <p><b>Motivo:</b> {liqMotivoLabel(inv.liqMotivo)}</p>}
      {inv.liqRuta && <p><b>Ruta:</b> {inv.liqRuta}</p>}
      {inv.liqOperador && <p><b>Operador:</b> {inv.liqOperador}</p>}
      {inv.liqComment && <p>{inv.liqComment}</p>}
      {inv.liqHasAttachment && (
        <div className="mt-0.5"><EvidenceButton photoId={`liqinv-${inv.id}`} label="Ver formato de devolución" downloadName={`formato_${invoiceFileTag(inv)}.jpg`} /></div>
      )}
      {who}
    </div>
  );
}

function LiquidacionInvoiceSheet({ invoice, onCancel, onConfirm }) {
  const [mode, setMode] = useState(null); // null | "no_liquidado"
  const [motivo, setMotivo] = useState(invoice.liqMotivo || "");
  const [comment, setComment] = useState(invoice.liqComment || "");
  const [ruta, setRuta] = useState(invoice.liqRuta || "");
  const [operador, setOperador] = useState(invoice.liqOperador || "");
  const [attachment, setAttachment] = useState(null); // archivo nuevo elegido en esta sesión
  const [busy, setBusy] = useState(false);

  const def = LIQ_MOTIVOS.find((m) => m.value === motivo) || null;
  const hadAttachment = !!invoice.liqHasAttachment;
  const canSave =
    !!def &&
    (!def.needsRoute || (ruta.trim() && operador.trim())) &&
    (!def.needsAttachment || attachment || hadAttachment) &&
    (!def.needsComment || comment.trim());

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    try {
      const isImage = file.type.startsWith("image/");
      const dataUrl = isImage ? await compressImage(file) : await readAsDataURL(file);
      setAttachment({ dataUrl, name: file.name, type: file.type || "application/octet-stream" });
    } finally {
      setBusy(false);
    }
  }

  async function confirmLiquidado() {
    setBusy(true);
    try { await onConfirm({ liqStatus: "liquidado" }); } finally { setBusy(false); }
  }
  async function confirmNoLiquidado() {
    if (!canSave) return;
    setBusy(true);
    try {
      await onConfirm({
        liqStatus: "no_liquidado",
        liqMotivo: motivo,
        liqComment: comment.trim() || null,
        liqRuta: def.needsRoute ? ruta.trim() : null,
        liqOperador: def.needsRoute ? operador.trim() : null,
        attachment,
      });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between mb-1">
          <div className="min-w-0">
            <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(invoice)}</p>
            <h3 className="font-semibold text-lg truncate">{invoice.cliente}</h3>
          </div>
          <button onClick={onCancel} className="shrink-0"><X size={20} /></button>
        </div>
        {invoice.liqStatus && invoice.liqStatus !== "pendiente" && (
          <div className="mb-2"><LiqStatusPill status={invoice.liqStatus} /></div>
        )}

        {mode !== "no_liquidado" ? (
          <div className="flex flex-col gap-3 mt-4">
            <button className="lg-btn lg-btn-ok !py-4 text-base" disabled={busy} onClick={confirmLiquidado}>
              <CheckCircle2 size={18} /> Liquidado
            </button>
            <button className="lg-btn lg-btn-bad !py-4 text-base" disabled={busy} onClick={() => setMode("no_liquidado")}>
              <XCircle size={18} /> No liquidado
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={onCancel}>Cancelar</button>
          </div>
        ) : (
          <div className="flex flex-col gap-3 mt-4">
            <div>
              <label className="text-sm font-medium">Motivo (obligatorio)</label>
              <select className="lg-input mt-1" value={motivo} onChange={(e) => setMotivo(e.target.value)}>
                <option value="">Selecciona un motivo…</option>
                {LIQ_MOTIVOS.map((m) => <option key={m.value} value={m.value}>{m.label}</option>)}
              </select>
            </div>

            {def?.needsRoute && (
              <>
                <div>
                  <label className="text-sm font-medium">Ruta donde se entregó</label>
                  <input className="lg-input mt-1" value={ruta} onChange={(e) => setRuta(e.target.value)} placeholder="Ej. E-E060 · Lagos" />
                </div>

/* Compara la fecha de creación de una ruta contra el día de hoy, para
   separar "Rutas de hoy" de "Rutas anteriores" en cada vista. */
function isToday(ts) {
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

/* Lunes de la semana de una fecha dada (semana laboral lunes–viernes,
   igual que el rol semanal de rutas). */
function startOfWeekMonday(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay(); // 0=domingo … 6=sábado
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d;
}
function dateKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
/* Fecha legible de una ruta (ej. "Lunes 22 de septiembre"). El año solo
   aparece si no es el año en curso. */
function routeDateLabel(ts) {
  const d = new Date(ts);
  const opts = { weekday: "long", day: "numeric", month: "long" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  const str = d.toLocaleDateString("es-MX", opts);
  return str.charAt(0).toUpperCase() + str.slice(1);
}
function dayLabel(ts) {
  const s = new Date(ts).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
  return `Ruta ${s}`;
}
function weekRangeLabel(ts) {
  const monday = startOfWeekMonday(ts);
  const friday = new Date(monday);
  friday.setDate(friday.getDate() + 4);
  const monthShort = (x) => x.toLocaleDateString("es-MX", { month: "short" }).replace(".", "");
  if (monday.getMonth() === friday.getMonth()) {
    return `Sem. del ${monday.getDate()} al ${friday.getDate()} ${monthShort(friday)}`;
  }
  return `Sem. del ${monday.getDate()} ${monthShort(monday)} al ${friday.getDate()} ${monthShort(friday)}`;
}

/* Encabezado plegable con un cuadrito de color, usado para agrupar
   rutas anteriores por día (semana en curso) o por semana (semanas ya
   cerradas) en la vista de Representantes de venta. */
function CollapsibleRouteGroup({ label, routes, onSelect }) {
  const [open, setOpen] = useState(false);
  return (
    <div>
      <button type="button" className="lg-card p-3.5 w-full flex items-center gap-2.5 text-left" onClick={() => setOpen((v) => !v)}>
        <span className="inline-block rounded-sm shrink-0" style={{ width: 10, height: 10, background: "var(--brand)" }} />
        <span className="font-medium flex-1 truncate">{label}</span>

        <ChevronLeft size={16} style={{ color: "var(--muted)", transform: open ? "rotate(90deg)" : "rotate(-90deg)" }} />
      </button>
      {open && (
        <div className="flex flex-col gap-3 mt-2.5 pl-1">
          {routes.map((r) => (
            <RouteRow key={r.id} r={r} onClick={() => onSelect(r.id)} />
          ))}
        </div>
      )}
    </div>
  );
}

/* Agrupa rutas que no son de hoy: las de esta semana por día, y las de
   semanas ya cerradas por semana completa. Compartido por Despacho y
   Representantes de venta para que se vean igual en ambos lados. */
function groupPreviousRoutes(previousRoutes) {
  const thisWeekMonday = startOfWeekMonday(new Date()).getTime();
  const thisWeekPrevious = previousRoutes.filter((r) => r.createdAt >= thisWeekMonday);
  const olderRoutes = previousRoutes.filter((r) => r.createdAt < thisWeekMonday);

  const byDay = {};
  thisWeekPrevious.forEach((r) => {
    const key = dateKey(r.createdAt);
    if (!byDay[key]) byDay[key] = { label: dayLabel(r.createdAt), routes: [] };
    byDay[key].routes.push(r);
  });
  const dayGroups = Object.entries(byDay).sort((a, b) => (a[0] < b[0] ? 1 : -1));

  const byWeek = {};
  olderRoutes.forEach((r) => {
    const wk = startOfWeekMonday(r.createdAt).getTime();
    if (!byWeek[wk]) byWeek[wk] = { label: weekRangeLabel(r.createdAt), routes: [] };
    byWeek[wk].routes.push(r);
  });
  const weekGroups = Object.entries(byWeek).sort((a, b) => Number(b[0]) - Number(a[0]));

  return { dayGroups, weekGroups };
}

/* Botón de carga bajo demanda: no descarga la foto/adjunto hasta que el
   usuario lo pide. photoId es la clave en logistica-fotos/{photoId}.
   inlineSrc es solo para compatibilidad con datos de rutas viejas que
   todavía traen la foto embebida (ahí no hace falta pedirla, ya está).
   mimeType decide si se abre en un lightbox (imagen) o se descarga
   directo (PDF u otro archivo). */
function EvidenceButton({ photoId, inlineSrc, mimeType, label = "Ver evidencia", downloadName }) {
  const [state, setState] = useState("idle"); // idle | loading | open | error
  const [src, setSrc] = useState(inlineSrc || null);
  const isImage = !mimeType || mimeType.startsWith("image/");

  async function open() {
    if (src) {
      if (isImage) setState("open");
      else triggerDownload(src);
      return;
    }
    setState("loading");
    try {
      const val = await fetchPhoto(photoId);
      if (!val) { setState("error"); return; }
      setSrc(val);
      if (isImage) setState("open");
      else { triggerDownload(val); setState("idle"); }
    } catch (err) {
      setState("error");
    }
  }
  function triggerDownload(dataUrl) {
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = downloadName || "archivo";
    a.click();
  }

  return (
    <>
      <button type="button" className="text-xs font-medium underline" style={{ color: "var(--brand)" }} onClick={open} disabled={state === "loading"}>
        {state === "loading" ? "Cargando…" : label}
      </button>
      {state === "error" && <span className="text-xs" style={{ color: "var(--bad)" }}>No se pudo cargar.</span>}
      {state === "open" && src && <ImageLightbox src={src} downloadName={downloadName} onClose={() => setState("idle")} />}
    </>
  );
}

function VentasView({ onExit }) {
  const [index, setIndex] = useState([]);
  const [searchEntries, setSearchEntries] = useState([]); // índice ligero de facturas, sin fotos
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [search, setSearch] = useState("");
  const [showPrevious, setShowPrevious] = useState(false);

  useEffect(() => {
    const unwatch = window.storage.watch(INDEX_KEY, (raw) => {
      setIndex(parseIndexSnapshot(raw));
    });
    return unwatch;
  }, []);
  // El índice de búsqueda guarda solo texto (factura, pedido, cliente…),
  // nunca fotos, así que escucharlo completo en tiempo real es barato:
  // no baja más que unos cuantos KB, sin importar cuántas rutas existan.
  useEffect(() => {
    const unwatch = window.storage.watch(SEARCH_INDEX_KEY, (raw) => {
      setSearchEntries(raw ? Object.values(raw) : []);
    });
    return unwatch;
  }, []);
  // La ruta completa (con fotos) solo se descarga cuando el usuario
  // realmente la abre, nunca por adelantado.
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);

  if (route) {
    return <RouteReadOnlyDetail route={route} onBack={() => setSelectedId(null)} />;
  }

  const query = search.trim().toLowerCase();
  let searchResults = null;
  if (query) {
    searchResults = searchEntries.filter((inv) => {
      const hay = [inv.factura, inv.pedido, inv.destino, inv.cliente].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(query);
    });
  }

  const todayRoutes = index.filter((r) => isToday(r.createdAt));
  const previousRoutes = index.filter((r) => !isToday(r.createdAt));
  const { dayGroups, weekGroups } = groupPreviousRoutes(previousRoutes);

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title="Representantes de venta" subtitle="Consulta de rutas y entregas" onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-6">
        <input
          className="lg-input"
          placeholder="Buscar por factura, pedido, cliente o código de cliente…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />

        {searchResults ? (
          <div>
            <h2 className="font-semibold mb-2">
              {searchResults.length} resultado{searchResults.length === 1 ? "" : "s"}
            </h2>
            <div className="flex flex-col gap-3">
              {searchResults.length === 0 && <EmptyState text="No se encontró ninguna factura con ese dato." />}
              {searchResults.map((inv) => (
                <div key={inv.id} className="cursor-pointer" onClick={() => setSelectedId(inv.routeId)}>
                  <InvoiceSearchResultCard inv={inv} />
                  <p className="text-xs text-right mt-1 mr-1" style={{ color: "var(--brand)" }}>Ver ruta completa y foto →</p>
                </div>
              ))}
            </div>
          </div>
        ) : (
          <div>
            <h2 className="font-semibold mb-2">Rutas de hoy</h2>
            <div className="flex flex-col gap-3">
              {todayRoutes.length === 0 && <EmptyState text="Sin rutas hoy todavía." />}
              {todayRoutes.map((r) => (
                <RouteRow key={r.id} r={r} onClick={() => setSelectedId(r.id)} />
              ))}
            </div>

            {previousRoutes.length > 0 && (
              <div className="mt-3">
                <button type="button" className="lg-btn lg-btn-ghost w-full" onClick={() => setShowPrevious((v) => !v)}>
                  {showPrevious ? "Ocultar" : "Mostrar"} rutas anteriores ({previousRoutes.length})
                </button>
                {showPrevious && (
                  <div className="flex flex-col gap-2.5 mt-3">
                    {dayGroups.map(([key, group]) => (
                      <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                    ))}
                    {weekGroups.map(([key, group]) => (
                      <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Raíz de la app                                                       */
/* ------------------------------------------------------------------ */

function LogisticaApp() {
  const [session, setSession] = useState(null); // { role, name }

  if (!session) {
    return <RoleGate onEnter={(role, name) => setSession({ role, name })} />;
  }
  if (session.role === "admin") {
    return <AdminView onExit={() => setSession(null)} />;
  }
  if (session.role === "liquidador") {
    return <LiquidadorView name={session.name} onExit={() => setSession(null)} />;
  }
  if (session.role === "ventas") {
    return <VentasView onExit={() => setSession(null)} />;
  }
  return <DriverView driverName={session.name} onExit={() => setSession(null)} />;
}


ReactDOM.render(<LogisticaApp />, document.getElementById("root"), function () {
  clearTimeout(window.__bootTimer);
  const boot = document.getElementById("boot-loading");
  if (boot) boot.remove();
});
</script>

<!-- PWA: registra el Service Worker (necesario para poder instalar la app) -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.error("No se pudo registrar el Service Worker:", err);
      });
    });
  }
</script>
