<script>
  /* Si la URL no trae el parámetro "v", redirige a sí misma agregando
     un valor único (la hora actual). Esto obliga al navegador y al
     servidor de GitHub Pages a entregar siempre la versión más
     reciente del archivo, sin que el usuario tenga que hacer nada. */
  if (!location.search.includes("v=")) {
    location.replace(location.pathname + "?v=" + Date.now());
  }
</script>
<script>
  /* Si algo falla al cargar la app, muestra el error en pantalla
     (en vez de dejar la pantalla en blanco) para poder diagnosticarlo. */
  window.addEventListener("error", function (e) {
    function show() {
      const box = document.createElement("pre");
      box.style.cssText = "white-space:pre-wrap;padding:16px;color:#b00020;font-size:14px;font-family:monospace;background:#fff3f3;margin:0;";
      box.textContent = "Error al cargar la app:\n\n" + (e.message || e) + "\n\nArchivo: " + (e.filename || "?") + "\nLínea: " + (e.lineno || "?");
      document.body.prepend(box);
    }
    if (document.body) show();
    else document.addEventListener("DOMContentLoaded", show);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    function show() {
      const box = document.createElement("pre");
      box.style.cssText = "white-space:pre-wrap;padding:16px;color:#b00020;font-size:14px;font-family:monospace;background:#fff3f3;margin:0;";
      const err = e.reason;
      box.textContent = "Error al guardar/leer datos (Firebase):\n\n" + (err && err.message ? err.message : String(err)) + (err && err.code ? "\n\nCódigo: " + err.code : "");
      document.body.prepend(box);
    }
    if (document.body) show();
    else document.addEventListener("DOMContentLoaded", show);
  });
</script>

    /* Guarda los datos en Firebase Realtime Database, así Administrador,
       Liquidación y Choferes ven la misma información sin importar el

    const firebaseConfig = {
      apiKey: "AIzaSyAFHI2n1bjnG1NR-wcN1Ys-wjFT1ww3EC4",
      authDomain: "infinite-deck-484214-e0.firebaseapp.com",

    };

    if (!window.storage) {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const root = db.ref("logistica-app");

      window.storage = {
        async get(key) {
          const snap = await root.child(key).once("value");
          const val = snap.val();
          return val === null || val === undefined ? null : { key, value: val, shared: true };
        },
        async set(key, value) {
          await root.child(key).set(value);
          return { key, value, shared: true };
        },
        async delete(key) {
          await root.child(key).remove();
          return { key, deleted: true, shared: true };
        },
        async list(p = "") {
          const snap = await root.once("value");
          const all = snap.val() || {};
          const keys = Object.keys(all).filter((k) => k.startsWith(p));
          return { keys, prefix: p, shared: true };
        },
        /* Escucha cambios en tiempo real (sin polling): Firebase llama a
           cb(valor) de inmediato con el dato actual y, después, solo cuando
           alguien realmente lo modifica. Devuelve una función para dejar de
           escuchar (llamarla al desmontar el componente o cambiar de ruta). */
        watch(key, cb) {
          const ref = root.child(key);
          const handler = (snap) => cb(snap.val());
          ref.on("value", handler, (err) => console.error("watch()", key, err));
          return () => ref.off("value", handler);
        },
        /* Igual que watch(), pero queryFn puede acotar la consulta (ej.
           ref => ref.orderByChild("driverKey").equalTo("juan")) para que
           Firebase solo mande —y solo vuelva a mandar— lo que de verdad le
           toca a quien escucha, no todo el nodo completo cada vez que
           cambia cualquier cosa de cualquiera. */
        watchQuery(key, queryFn, cb) {
          let ref = root.child(key);
          if (queryFn) ref = queryFn(ref);
          const handler = (snap) => cb(snap.val());
          ref.on("value", handler, (err) => console.error("watchQuery()", key, err));
          return () => ref.off("value", handler);
        },
        /* Escritura atómica en varias rutas a la vez, ej:
             { "search-index/inv_1": {...}, "search-index/inv_2": null }
           Un valor `null` borra esa ruta. No afecta nada fuera de las rutas
           indicadas (a diferencia de re-guardar un objeto completo). */
        async update(map) {
          if (!map || Object.keys(map).length === 0) return;
          await root.update(map);
        },
        /* Transacción: fn recibe el valor MÁS RECIENTE del servidor (nunca
           el que tengas en memoria del navegador) y debe devolver el nuevo
           valor. Si dos personas guardan casi al mismo tiempo, Firebase
           reintenta fn solo con la que perdió la carrera — así nadie le
           borra el cambio a nadie. */
        async transact(key, fn) {
          const res = await root.child(key).transaction(fn);
          return res;
        },
      };
    }

const INDEX_KEY = "routes-index";

/* routes-index vive como UNA ruta por hijo (routes-index/{routeId} =
   {...}), no como un bloque de texto con el arreglo completo. Así,
   Firebase puede mandarle a cada chofer SOLO sus propias rutas (con una
   consulta orderByChild+equalTo) en vez de reenviarle la lista
   completa de todas las rutas de todos cada vez que cualquiera hace
   cualquier cambio.

   parseIndexSnapshot() entiende los dos formatos (el nuevo, de hijos, y
   el viejo, de bloque de texto) para que la transición entre uno y
   otro —mientras alguien no haya tocado el botón de mantenimiento— no
   rompa nada: simplemente sigue leyendo el formato viejo hasta que se
   migre. */
function parseIndexSnapshot(raw) {
  if (!raw) return [];
  if (typeof raw === "string") {
    try { return JSON.parse(raw); } catch { return []; }
  }
  return Object.values(raw);
}
/* Clave normalizada para comparar nombre de chofer sin que importen
   mayúsculas/espacios — tanto al guardar una ruta como al consultarla,
   para que la búsqueda del lado del servidor encuentre exactamente lo
   mismo que antes encontraba el .filter() del lado del cliente. */
function driverKey(name) {
  return String(name || "").trim().toLowerCase();
}
async function getIndex() {
  const res = await window.storage.get(INDEX_KEY, true);
  return parseIndexSnapshot(res ? res.value : null);
}
/* Crea o reemplaza por completo la entrada de UNA ruta en el índice
   (no toca las demás). */
async function setIndexEntry(routeId, entry) {
  await window.storage.update({ [`${INDEX_KEY}/${routeId}`]: entry });
}
/* Cambia solo algunos campos de la entrada de una ruta (contadores,
   nombre, estatus de liquidación…), sin tocar el resto ni las demás
   rutas — remplaza al viejo updateIndex() transaccional, que ya no
   hace falta: como cada ruta es su propio nodo, dos personas editando
   rutas distintas (o campos distintos de la misma ruta) nunca chocan. */
async function patchIndexEntry(routeId, fields) {
  const map = {};
  Object.keys(fields).forEach((k) => { map[`${INDEX_KEY}/${routeId}/${k}`] = fields[k]; });
  await window.storage.update(map);
}
async function removeIndexEntry(routeId) {
  await window.storage.update({ [`${INDEX_KEY}/${routeId}`]: null });
}
/* Migración única (se dispara sola dentro del botón de mantenimiento):
   si routes-index todavía es el bloque de texto viejo, lo convierte a
   una ruta por hijo. Si ya está en el formato nuevo (o no hay nada
   guardado todavía), no hace nada. */
async function migrateIndexSchema() {
  const res = await window.storage.get(INDEX_KEY, true);
  const raw = res ? res.value : null;
  if (!raw || typeof raw !== "string") return { migrated: 0 };
  let list;
  try { list = JSON.parse(raw); } catch { return { migrated: 0 }; }
  const map = {};
  list.forEach((r) => { map[`${INDEX_KEY}/${r.id}`] = { ...r, driverKey: driverKey(r.driverName) }; });
  await window.storage.update(map);
  return { migrated: list.length };
}

}

const COORDS_KEY = "coords-index";
const DEPOT_KEY = "depot";
// Punto de partida por defecto (PYMSA, El Álamo Industrial) — el admin
// lo puede cambiar desde la pantalla de rutas sin tocar código.
const DEFAULT_DEPOT = { lat: 20.617582, lng: -103.338284, label: "PYMSA · El Álamo Industrial" };

async function getCoordsIndex() {
  const res = await window.storage.get(COORDS_KEY);
  return (res && res.value) || {};
}
async function getDepot() {
  const res = await window.storage.get(DEPOT_KEY);
  return (res && res.value) || DEFAULT_DEPOT;
}
async function saveDepot(depot) {
  await window.storage.set(DEPOT_KEY, depot);
}

/* Distancia en línea recta entre dos puntos (fórmula de Haversine),
   en kilómetros. No sabe de calles ni sentidos — es una aproximación
   gratuita, por eso el orden que arma se puede ajustar a mano después. */
function haversineKm(a, b) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const s =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

/* Ordena las facturas de una ruta por cercanía real (no alfabética):
   empieza en el depot y, en cada paso, va a la factura sin visitar más
   cercana a donde "está parado" (heurística del vecino más próximo —
   no es matemáticamente perfecta, pero es gratis y da una ruta
   razonable). Las facturas sin coordenada conocida para su código se
   quedan al final, sin ordenar, para que sean fáciles de detectar y
   completar en el Excel de coordenadas. */
function orderInvoicesByProximity(invoices, coordsIndex, depot) {
  const withCoord = [];
  const withoutCoord = [];
  invoices.forEach((inv) => {
    const c = coordsIndex[String(inv.destino || "").trim()];
    if (c && typeof c.lat === "number" && typeof c.lng === "number") withCoord.push({ inv, coord: c });
    else withoutCoord.push(inv);
  });
  const ordered = [];
  let current = depot;
  const remaining = withCoord.slice();
  while (remaining.length) {
    let bestIdx = 0;
    let bestDist = Infinity;
    remaining.forEach((item, idx) => {
      const d = haversineKm(current, item.coord);
      if (d < bestDist) { bestDist = d; bestIdx = idx; }
    });
    const [chosen] = remaining.splice(bestIdx, 1);
    ordered.push(chosen.inv);
    current = chosen.coord;
  }
  return { invoices: [...ordered, ...withoutCoord], placed: ordered.length, missing: withoutCoord.length };
}

/* Detecta qué facturas no se pueden ubicar en el mapa: las que no traen
   código de destino, y los códigos que no están en la tabla de
   coordenadas (agrupados, con los clientes a los que pertenecen y
   cuántas facturas afectan). */
function findMissingCoords(entries, coordsIndex) {
  const noCode = [];
  const byCode = new Map();
  (entries || []).forEach((inv) => {
    const code = String(inv.destino || "").trim();
    if (!code) { noCode.push(inv); return; }
    if (coordsIndex[code]) return;
    if (!byCode.has(code)) byCode.set(code, { codigo: code, clientes: new Set(), count: 0 });
    const g = byCode.get(code);
    if (inv.cliente) g.clientes.add(inv.cliente);
    g.count++;
  });
  const codes = Array.from(byCode.values())
    .map((g) => ({ ...g, clientes: Array.from(g.clientes) }))
    .sort((a, b) => b.count - a.count);
  return { noCode, codes };
}

/* Aviso dentro de una ruta: qué facturas se quedarán al final al ordenar
   por cercanía, y por qué. */
function MissingCoordsBanner({ invoices, coordsIndex }) {
  const { noCode, codes } = findMissingCoords(invoices, coordsIndex);
  if (!noCode.length && !codes.length) return null;
  const total = noCode.length + codes.reduce((s, c) => s + c.count, 0);
  return (
    <div className="rounded-lg p-3 mb-3 text-sm" style={{ background: "var(--warn-bg)", color: "var(--warn)" }}>
      <p className="font-semibold flex items-center gap-1.5">
        <AlertTriangle size={15} /> {total} factura{total === 1 ? "" : "s"} sin coordenada · quedarán al final al ordenar
      </p>
      <ul className="mt-1.5 flex flex-col gap-0.5">
        {codes.map((c) => (
          <li key={c.codigo}>
            <span className="lg-mono font-semibold">{c.codigo}</span> · {c.clientes.join(", ") || "sin cliente"} ({c.count})
          </li>
        ))}
        {noCode.map((inv) => (
          <li key={inv.id}>
            <b>Sin código de destino:</b> {invoiceLabel(inv)} · {inv.cliente}
          </li>
        ))}
      </ul>
    </div>
  );
}

/* Lista general (todas las rutas) de códigos que faltan en la tabla de
   coordenadas. Solo cuenta facturas pendientes: son las que todavía hay
   que ordenar. Se lee una sola vez al abrir, no se queda escuchando. */
function MissingCoordsSheet({ coordsIndex, onClose }) {
  const [state, setState] = useState("loading"); // loading | ready | error
  const [result, setResult] = useState(null);

  useEffect(() => {
    let cancelled = false;
    window.storage.get(SEARCH_INDEX_KEY)
      .then((res) => {
        if (cancelled) return;
        const entries = Object.values((res && res.value) || {}).filter((e) => e.status === "pendiente");
        setResult(findMissingCoords(entries, coordsIndex));
        setState("ready");
      })
      .catch(() => { if (!cancelled) setState("error"); });
    return () => { cancelled = true; };
  }, []);

  function copyList() {
    const text = result.codes.map((c) => `${c.codigo}\t${c.clientes.join(" / ")}`).join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => window.alert("Lista copiada. Pégala en tu Excel: queda Código en una columna y Cliente en la otra."))
        .catch(() => window.alert("No se pudo copiar automáticamente."));
    } else {
      window.alert("Tu navegador no permite copiar automáticamente.");
    }
  }

  return (
    <div className="lg-scrim" onClick={onClose}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 560 }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Códigos sin coordenada</h3>
          <button onClick={onClose}><X size={20} /></button>
        </div>
        {state === "loading" && <p className="text-sm" style={{ color: "var(--muted)" }}>Revisando facturas pendientes…</p>}
        {state === "error" && <p className="text-sm" style={{ color: "var(--bad)" }}>No se pudo leer la información.</p>}
        {state === "ready" && result.codes.length === 0 && result.noCode.length === 0 && (
          <p className="text-sm rounded-md p-3" style={{ background: "var(--ok-bg)", color: "var(--ok)" }}>
            Todas las facturas pendientes tienen coordenada. 
          </p>
        )}
        {state === "ready" && (result.codes.length > 0 || result.noCode.length > 0) && (
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Facturas pendientes que no se pueden ordenar por cercanía. Agrega estos códigos a tu Excel de coordenadas.
            </p>
            <div className="flex flex-col gap-1.5 max-h-[45vh] overflow-y-auto pr-0.5">
              {result.codes.map((c) => (
                <div key={c.codigo} className="flex items-center justify-between gap-3 text-sm py-1.5 px-2 rounded-md" style={{ background: "var(--paper)" }}>
                  <span className="min-w-0 truncate"><span className="lg-mono font-semibold">{c.codigo}</span> · {c.clientes.join(", ") || "sin cliente"}</span>
                  <span className="text-xs shrink-0" style={{ color: "var(--muted)" }}>{c.count} fact.</span>
                </div>
              ))}
              {result.noCode.length > 0 && (
                <p className="text-sm rounded-md p-2 mt-1" style={{ background: "var(--warn-bg)", color: "var(--warn)" }}>
                  <b>{result.noCode.length}</b> factura{result.noCode.length === 1 ? "" : "s"} sin código de destino (no se pueden ubicar hasta que se les asigne uno).
                </p>
              )}
            </div>
            {result.codes.length > 0 && (
              <button className="lg-btn lg-btn-brand" onClick={copyList}>Copiar lista para Excel</button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/*
 * Lee un archivo .xlsx/.csv de coordenadas. Columnas que reconoce
 * (tolera variantes de mayúsculas/acentos): "Código", "Latitud",
 * "Longitud". Devuelve { rows: [{codigo, lat, lng}], skipped }.
 */
async function parseCoordsExcel(file) {
  const isCsv = /\.csv$/i.test(file.name);
  let wb;
  if (isCsv) {
    const text = await file.text();
    wb = XLSX.read(text, { type: "string" });
  } else {
    const buf = await file.arrayBuffer();
    wb = XLSX.read(new Uint8Array(buf), { type: "array" });
  }
  let best = null;
  for (const sheetName of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: true });
    if (!aoa.length) continue;
    const headers = aoa[0].map((h) => String(h ?? "").trim());
    const dataRows = aoa
      .slice(1)
      .filter((arr) => arr.some((c) => String(c ?? "").trim() !== ""))
      .map((arr) => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = arr[i] ?? ""; });
        return obj;
      });
    const rows = [];
    let skipped = 0;
    for (const row of dataRows) {
      const codigo = cleanFolio(getField(row, "Código") || getField(row, "Codigo") || getField(row, "Cód."));
      const lat = parseFloat(getField(row, "Latitud") || getField(row, "Lat"));
      const lng = parseFloat(getField(row, "Longitud") || getField(row, "Lng") || getField(row, "Lon"));
      if (!codigo || !Number.isFinite(lat) || !Number.isFinite(lng)) { skipped++; continue; }
      rows.push({ codigo, lat, lng });
    }
    if (!best || rows.length > best.rows.length) {
      best = { rows, skipped, totalRows: dataRows.length, sheetName, sheetNames: wb.SheetNames };
    }
  }
  return best;
}
/* ------------------------------------------------------------------ */
/* Fotos (evidencias de entrega/devolución y adjuntos de liquidación)  */
/* SEPARADAS de las rutas — viven en su propio nodo raíz, cada una en  */
/* su propia clave. Como RTDB re-sincroniza el nodo completo ante      */
/* cualquier cambio de un hijo, si las fotos vivieran dentro del        */
/* objeto de la ruta, CADA cambio de estatus de CUALQUIER factura       */
/* obligaría a todos los clientes conectados a esa ruta a re-descargar */
/* TODAS sus fotos. Separadas así, la ruta solo guarda un booleano      */
/* (hasPhoto) y la foto se pide aparte, solo cuando alguien la abre.    */
/* ------------------------------------------------------------------ */
const PHOTOS_KEY = "logistica-fotos";

async function savePhoto(photoId, dataUrl) {
  await window.storage.set(`${PHOTOS_KEY}/${photoId}`, dataUrl);
}
async function fetchPhoto(photoId) {
  const res = await window.storage.get(`${PHOTOS_KEY}/${photoId}`);
  return res ? res.value : null;
}
async function deletePhoto(photoId) {
  await window.storage.delete(`${PHOTOS_KEY}/${photoId}`);
}

/* ------------------------------------------------------------------ */
/* Índice de búsqueda (para VentasView) — SOLO texto, sin fotos.       */
/* Cada factura vive en "search-index/{invId}" como un objeto pequeño */
/* (no como el JSON gigante de la ruta completa), así buscar no        */
/* implica descargar megabytes de imágenes en Base64.                  */
/* ------------------------------------------------------------------ */
const SEARCH_INDEX_KEY = "search-index";

function invoiceSearchEntry(route, inv) {
  return {
    id: inv.id,
    factura: inv.factura || "",
    pedido: inv.pedido || "",
    cliente: inv.cliente || "",
    destino: inv.destino || "",
    direccion: inv.direccion || "",
    status: inv.status || "pendiente",
    comment: inv.comment || null,
    faltante: !!inv.faltante,
    incidencia: inv.incidencia || null,
    hasPhoto: !!(inv.hasPhoto || inv.photo),
    updatedAt: inv.updatedAt || Date.now(),
    liqStatus: inv.liqStatus || "pendiente",
    liqMotivo: inv.liqMotivo || null,
    liqComment: inv.liqComment || null,
    liqRuta: inv.liqRuta || null,
    liqOperador: inv.liqOperador || null,
    liqHasAttachment: !!inv.liqHasAttachment,
    liqBy: inv.liqBy || null,
    liqAt: inv.liqAt || null,
    routeId: route.id,
    routeName: route.name,
    driverName: route.driverName,
  };
}
/* Reescribe en el índice la entrada de cada factura de esta ruta
   (crear/editar factura, cambiar estatus, renombrar ruta, etc). No
   borra facturas que ya no estén en route.invoices; para eso usa
   removeInvoiceFromSearchIndex / removeRouteFromSearchIndex. */
async function syncSearchIndex(route) {
  const map = {};
  (route.invoices || []).forEach((inv) => {
    map[`${SEARCH_INDEX_KEY}/${inv.id}`] = invoiceSearchEntry(route, inv);
  });
  await window.storage.update(map);
}
async function removeInvoiceFromSearchIndex(invId) {
  await window.storage.update({ [`${SEARCH_INDEX_KEY}/${invId}`]: null });
}
async function removeRouteFromSearchIndex(route) {
  const map = {};
  (route.invoices || []).forEach((inv) => { map[`${SEARCH_INDEX_KEY}/${inv.id}`] = null; });
  await window.storage.update(map);
}
/* Totales de una ruta (entregadas/fallidas/total), sin fotos. Se guardan
   directamente en routes-index para que las tarjetas de ruta (RouteRow)
   puedan pintar la barra de progreso sin tener que descargar la ruta
   completa (con todas sus fotos) solo para contar estatus. */
/* Junta las facturas del mismo cliente para que salgan consecutivas en
   la lista, sin reordenar alfabéticamente todo lo demás: cada cliente
   conserva el lugar de su primera aparición, y sus demás facturas se
   acomodan justo ahí junto a esa. Es solo para mostrar — no cambia el
   orden guardado en la ruta. */
function groupByClient(invoices) {
  const list = invoices || [];
  const groups = new Map();
  const order = [];
  for (const inv of list) {
    const key = (inv.cliente || "").trim().toLowerCase();
    if (!groups.has(key)) { groups.set(key, []); order.push(key); }
    groups.get(key).push(inv);
  }
  return order.flatMap((key) => groups.get(key));
}
function routeCounts(invoices) {
  const list = invoices || [];
  return {
    total: list.length,
    ok: list.filter((i) => i.status === "entregado").length,
    bad: list.filter((i) => i.status === "fallido").length,
  };
}
/* Igual que routeCounts, pero para la liquidación por factura (no la
   entrega): cuántas están liquidadas y cuántas no, dentro de una ruta.
   Lo que falte de "total" para llegar a liqOk+liqBad son las pendientes
   de liquidar todavía. */
function liqCounts(invoices) {
  const list = invoices || [];
  return {
    liqOk: list.filter((i) => i.liqStatus === "liquidado").length,
    liqBad: list.filter((i) => i.liqStatus === "no_liquidado").length,
  };
}

/* Migración única (botón de Admin): hace tres cosas sobre TODAS las
   rutas existentes, una sola vez, a demanda —nunca automáticamente ni
   en un timer—:
   1) Reconstruye el índice de búsqueda de Ventas.
   2) Reconstruye los contadores de routes-index (barra de progreso).
   3) Aplana fotos que hayan quedado embebidas dentro de rutas viejas
      (de antes de esta versión): las saca a logistica-fotos/{id} y dep
      deja solo hasPhoto:true en la factura, para que esa ruta deje de
      pesar megabytes cada vez que alguien la abre o alguien más edita
      otra factura de la misma ruta.
   Los contadores recalculados se aplican como parches por ruta (cada
   ruta es su propio nodo), nunca sobrescribiendo el índice completo,
   para no pisar cambios que otros usuarios guarden mientras esto
   corre. */
async function rebuildSearchIndex(onProgress) {
  const { migrated } = await migrateIndexSchema();
  const idx = await getIndex();
  const map = {};
  const computed = {};
  let photosFlattened = 0;
  for (let i = 0; i < idx.length; i++) {
    const r = await getRoute(idx[i].id);
    if (r) {
      let changed = false;
      const invoices = [];
      for (const inv of (r.invoices || [])) {
        if (inv.photo && !inv.hasPhoto) {
          await savePhoto(inv.id, inv.photo);
          const { photo, ...rest } = inv;
          invoices.push({ ...rest, hasPhoto: true });
          changed = true;
          photosFlattened++;
        } else {
          invoices.push(inv);
        }
      }
      let liquidacion = r.liquidacion;
      if (liquidacion && liquidacion.photo && !(liquidacion.attachment && liquidacion.attachment.name)) {
        await savePhoto(`liq-${r.id}`, liquidacion.photo);
        liquidacion = { ...liquidacion, photo: null, attachment: { name: "foto.jpg", type: "image/jpeg" } };
        changed = true;
        photosFlattened++;
      }
      if (changed) await saveRoute({ ...r, invoices, liquidacion });
      invoices.forEach((inv) => { map[`${SEARCH_INDEX_KEY}/${inv.id}`] = invoiceSearchEntry(r, inv); });
      computed[idx[i].id] = { ...routeCounts(invoices), ...liqCounts(invoices), liquidacionStatus: liquidacion ? liquidacion.status : null };
    }
    if (onProgress) onProgress(i + 1, idx.length);
  }
  const invoiceCount = Object.keys(map).length;
  Object.keys(computed).forEach((routeId) => {
    Object.keys(computed[routeId]).forEach((field) => {
      map[`${INDEX_KEY}/${routeId}/${field}`] = computed[routeId][field];
    });
  });
  await window.storage.update(map);
  return { invoices: invoiceCount, photosFlattened, migrated };
}

/* Excel de liquidación por rango de fechas: usa el índice de búsqueda
   (texto, sin fotos) cruzado con las fechas de routes-index, así que no
   hace falta descargar ninguna ruta completa para armarlo. fromDate y
   toDate son strings "YYYY-MM-DD" (del input type=date). */
async function exportLiquidacionExcel(fromDate, toDate, routesIndex) {
  const res = await window.storage.get(SEARCH_INDEX_KEY);
  const entries = Object.values((res && res.value) || {});
  const routeDates = {};
  routesIndex.forEach((r) => { routeDates[r.id] = r.createdAt; });
  const from = new Date(`${fromDate}T00:00:00`).getTime();
  const to = new Date(`${toDate}T23:59:59`).getTime();
  const rows = entries
    .filter((inv) => {
      const ts = routeDates[inv.routeId];
      return ts != null && ts >= from && ts <= to;
    })
    .sort((a, b) => (routeDates[a.routeId] || 0) - (routeDates[b.routeId] || 0))
    .map((inv) => ({
      Fecha: new Date(routeDates[inv.routeId]).toLocaleDateString("es-MX"),
      Ruta: inv.routeName || "",
      Chofer: inv.driverName || "",
      Factura: inv.factura || "",
      Pedido: inv.pedido || "",
      Cliente: inv.cliente || "",
      "Cód. destino": inv.destino || "",
      "Estatus entrega": STATUS[inv.status]?.label || inv.status || "",
      "Estatus liquidación": LIQ_STATUS[inv.liqStatus || "pendiente"]?.label || "Pendiente",
      "Motivo no liquidado": inv.liqComment || "",
    }));
  if (rows.length === 0) return { count: 0 };
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{ wch: 12 }, { wch: 18 }, { wch: 16 }, { wch: 12 }, { wch: 12 }, { wch: 24 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 30 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Liquidacion");
  XLSX.writeFile(wb, `Liquidacion_${fromDate}_a_${toDate}.xlsx`);
  return { count: rows.length };
}

/* Comprime una foto a base64 (máx 900px, jpeg 0.6) para no exceder límites */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Obtiene la ubicación GPS actual; si el chofer no da permiso o el
   teléfono no puede obtenerla, resuelve null sin romper el flujo. */
function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  });
}

/* Convierte un valor de celda de folio/código a texto limpio (sin .0) */
function cleanFolio(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "number") return String(Math.trunc(v));
  return String(v).trim();
}

/* Texto a mostrar como identificador de una factura: prioriza el número
   de Factura; si todavía no la generan, aclara que se muestra el Pedido. */
function invoiceLabel(inv) {
  if (inv.factura) return `#${inv.factura}`;
  if (inv.pedido) return `Pedido ${inv.pedido} (sin factura)`;
  return "Sin folio";
}
function invoiceFileTag(inv) {
  return inv.factura || inv.pedido || inv.id;
}
/* Una factura que empieza con "6" es una recolección posterior, no una
   entrega normal. */
function isRecoleccion(inv) {
  return /^6/.test(String(inv.factura || "").trim());
}
function RecoleccionTag() {
  return (
    <span
      className="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full"
      style={{ background: "#F3E8FF", color: "#7C3AED", border: "1.5px solid #DDD6FE" }}
    >
      <Package size={12} /> Recolección posterior
    </span>
  );
}
function mapsLink(loc) {
  return `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
}
/* Fecha y hora exacta en que se guardó una foto/estatus, para poder ver
   el orden real en que el chofer fue completando sus entregas. */
function formatDateTime(ts) {
  if (!ts) return "";
  return new Date(ts).toLocaleString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* Busca una columna por nombre tolerando espacios extra / mayúsculas distintas */
function getField(row, name) {
  if (name in row) return row[name];
  const target = name.trim().toLowerCase();
  const key = Object.keys(row).find((k) => k.trim().toLowerCase() === target);
  return key ? row[key] : "";
}

/*
 * Lee un archivo .xlsx/.csv de rutas y lo agrupa por código de "Ruta".
 * Columnas que reconoce (nombres tal cual el reporte de despacho):
 *   Destinatario mcía. (código de destino), Ruta, Pedido, Factura,
 *   Fecha salida mcías., Ruta Texto (población) y
 *   Nombre destinatario de mercancías (nombre del destino).
 * Si una fila no trae Factura todavía, se usa el Pedido como folio
 * temporal para no perder esa entrega del reporte.
 * Devuelve: [{ code, locality, invoices: [...], skipped }]
 */
async function parseRoutesExcel(file) {
  const isCsv = /\.csv$/i.test(file.name);
  let wb;
  if (isCsv) {
    const text = await file.text();
    wb = XLSX.read(text, { type: "string" });
  } else {
    const buf = await file.arrayBuffer();
    wb = XLSX.read(new Uint8Array(buf), { type: "array" });
  }

  // Revisa TODAS las hojas del archivo (no solo la primera) y se queda
  // con la que produzca más facturas válidas — así no depende de que
  // la hoja se llame "Hoja1" ni de que sea la primera pestaña.
  let best = null;
  for (const sheetName of wb.SheetNames) {
    // Se lee en modo "arreglo de arreglos" y los encabezados se toman
    // manualmente de la primera fila. Esto evita depender de cómo la
    // librería adivina las columnas, que puede variar según cómo se
    // haya generado el archivo .xlsx original.
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: true });
    if (!aoa.length) continue;
    const headers = aoa[0].map((h) => String(h ?? "").trim());
    const rows = aoa
      .slice(1)
      .filter((arr) => arr.some((c) => String(c ?? "").trim() !== ""))
      .map((arr) => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = arr[i] ?? ""; });
        return obj;
      });
    const groups = new Map();
    let skipped = 0;

    for (const row of rows) {
      const code = String(getField(row, "Ruta") || "").trim();
      const factura = cleanFolio(getField(row, "Factura"));
      const pedido = cleanFolio(getField(row, "Pedido"));
      if (!code || (!factura && !pedido)) { skipped++; continue; }

      const destino = cleanFolio(getField(row, "Destinatario mcía."));
      const cliente = String(getField(row, "Nombre destinatario de mercancías") || "Sin nombre").trim();
      const locality = String(getField(row, "Ruta Texto") || "Sin localidad").trim();
      const fecha = String(getField(row, "Fecha salida mcías.") || "").trim();

      if (!groups.has(code)) groups.set(code, { code, locality, invoices: [] });
      const g = groups.get(code);
      g.invoices.push({ factura, pedido, destino, cliente, direccion: locality || "Sin localidad", fecha });
      if (!g.locality) g.locality = locality;
    }

    const groupsArr = Array.from(groups.values());
    const totalInvoices = groupsArr.reduce((a, g) => a + g.invoices.length, 0);
    const bestInvoices = best ? best.groups.reduce((a, g) => a + g.invoices.length, 0) : -1;
    if (totalInvoices > bestInvoices) {
      best = { groups: groupsArr, skipped, totalRows: rows.length, headers, sheetName, sheetNames: wb.SheetNames };
    }
  }

  return best;
}

function StatusPill({ status }) {
  const s = STATUS[status] || STATUS.pendiente;

  return (

      style={{ background: s.bg, color: s.fg, border: `1.5px solid ${s.border}` }}

    >

function LiquidacionPill({ status }) {
  if (status === "liquidado") {
    return (
      <span className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full"

      </span>
    );
  }

function ProgressBar({ invoices, counts }) {
  const c = counts || routeCounts(invoices);
  const total = c.total || 1;
  const ok = c.ok;
  const bad = c.bad;
  const pend = Math.max(0, c.total - ok - bad);
  return (
    <div>
      <div className="flex h-2.5 w-full rounded-full overflow-hidden" style={{ background: "var(--line)" }}>
        <div style={{ width: `${(ok / total) * 100}%`, background: "var(--ok)" }} />
        <div style={{ width: `${(bad / total) * 100}%`, background: "var(--bad)" }} />
      </div>
      <div className="flex gap-3 mt-1.5 text-xs" style={{ color: "var(--muted)" }}>
        <span>{ok} entregadas</span>
        <span>{bad} fallidas</span>
        <span>{pend} pendientes</span>
      </div>
    </div>
  );
}

/* Selector de chofer: lista fija de nombres, con opción de escribir otro
   si despacho necesita asignar a alguien que aún no está en la lista. */
function DriverPicker({ value, onChange, placeholder }) {
  const [custom, setCustom] = useState(Boolean(value) && !DRIVERS.includes(value));
  if (custom) {
    return (
      <div className="flex flex-col gap-1">
        <input
          className="lg-input"
          placeholder={placeholder || "Nombre del chofer"}
          value={value}
          onChange={(e) => onChange(e.target.value)}
        />
        <button type="button" className="text-xs font-medium underline self-start" style={{ color: "var(--brand)" }}
          onClick={() => { setCustom(false); onChange(""); }}>
          Elegir de la lista
        </button>
      </div>
    );
  }
  return (
    <div className="flex flex-col gap-1">
      <select className="lg-input" value={value} onChange={(e) => onChange(e.target.value)}>
        <option value="">{placeholder || "Selecciona un chofer"}</option>
        {DRIVERS.map((d) => <option key={d} value={d}>{d}</option>)}
      </select>
      <button type="button" className="text-xs font-medium underline self-start" style={{ color: "var(--brand)" }}
        onClick={() => setCustom(true)}>
        Escribir otro nombre
      </button>
    </div>
  );
}

function RoleGate({ onEnter }) {

            <p className="font-bold text-xl leading-none">MEDICOM</p>

          </div>
        </div>
        <h1 className="text-2xl font-semibold mt-6 mb-1">Entregas del día</h1>
        <p style={{ color: "var(--muted)" }} className="text-sm mb-8">
          Elige cómo vas a entrar. Los datos se comparten entre despacho, liquidación y choferes.
        </p>

        {!role && (
          <div className="flex flex-col gap-3">
            <button className="lg-btn lg-btn-dark !justify-between !py-5" onClick={() => setRole("admin")}>
              <span className="flex items-center gap-3"><ClipboardList size={20} /> Despacho (Administrador)</span>
              <ChevronLeft size={18} className="rotate-180" />
            </button>
            <button className="lg-btn lg-btn-dark2 !justify-between !py-5" onClick={() => setRole("liquidador")}>
              <span className="flex items-center gap-3"><ShieldCheck size={20} /> Liquidación de ruta</span>
              <ChevronLeft size={18} className="rotate-180" />
            </button>
            <button className="lg-btn lg-btn-outline-brand !justify-between !py-5" onClick={() => onEnter("ventas", "Ventas")}>
              <span className="flex items-center gap-3"><FileSpreadsheet size={20} /> Representantes de venta</span>
              <ChevronLeft size={18} className="rotate-180" />

            <button className="lg-btn lg-btn-brand !justify-between !py-5" onClick={() => setRole("driver")}>
              <span className="flex items-center gap-3"><Truck size={20} /> Soy chofer</span>
              <ChevronLeft size={18} className="rotate-180" />

        {role === "driver" && (
          <div className="flex flex-col gap-3">
            <label className="text-sm font-medium">¿Cuál es tu nombre?</label>

            <label className="text-sm font-medium">Contraseña</label>
            <input className="lg-input" type="password" value={pass}
              onChange={(e) => { setPass(e.target.value); setError(""); }} />
            {error && <p className="text-sm" style={{ color: "var(--bad)" }}>{error}</p>}
            <button
              className="lg-btn lg-btn-brand mt-1"
              disabled={!driverName.trim() || !pass}
              onClick={() => {
                const expected = DRIVER_ACCOUNTS[driverName] || DEFAULT_DRIVER_PASSWORD;
                if (pass === expected) onEnter("driver", driverName.trim());

          <div className="flex flex-col gap-3">
            <div>
              <label className="text-sm font-medium">Usuario</label>
              <input className="lg-input mt-1" value={user} autoCapitalize="none" autoFocus

function AdminView({ onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [showNewRoute, setShowNewRoute] = useState(false);
  const [showNewInvoice, setShowNewInvoice] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [editingRoute, setEditingRoute] = useState(false);
  const [showClosePending, setShowClosePending] = useState(false);
  const [showPrevious, setShowPrevious] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [rebuilding, setRebuilding] = useState(false);
  const [showImportCoords, setShowImportCoords] = useState(false);
  const [showMissing, setShowMissing] = useState(false);
  const [editingDepot, setEditingDepot] = useState(false);
  const [coordsIndex, setCoordsIndex] = useState({});
  const [depot, setDepot] = useState(DEFAULT_DEPOT);
  const [ordering, setOrdering] = useState(false);

  // Escucha el índice de rutas en tiempo real: Firebase avisa solo cuando
  // alguien crea/borra/renombra una ruta, sin volver a preguntar cada 4s.
  useEffect(() => {
    const unwatch = window.storage.watch(INDEX_KEY, (raw) => {
      setIndex(parseIndexSnapshot(raw));
    });
    return unwatch;
  }, []);
  // Igual para la ruta abierta: solo baja datos nuevos (y sus fotos)
  // cuando esa ruta específica cambia de verdad.
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);
  // Coordenadas (para saber qué facturas se pueden ordenar por cercanía)
  // y el punto de partida — ambos livianos, sin fotos.
  useEffect(() => {
    const unwatch = window.storage.watch(COORDS_KEY, (raw) => setCoordsIndex(raw || {}));
    return unwatch;
  }, []);
  useEffect(() => {
    const unwatch = window.storage.watch(DEPOT_KEY, (raw) => setDepot(raw || DEFAULT_DEPOT));
    return unwatch;
  }, []);

  async function handleImportCoords(rows) {
    const map = {};
    rows.forEach((r) => { map[`${COORDS_KEY}/${r.codigo}`] = { lat: r.lat, lng: r.lng }; });
    await window.storage.update(map);
    setShowImportCoords(false);
    window.alert(`Se guardaron ${rows.length} coordenadas.`);
  }

  async function handleSaveDepot(lat, lng, label) {
    await saveDepot({ lat, lng, label: label || DEFAULT_DEPOT.label });
    setEditingDepot(false);
  }

  async function handleOrderByProximity() {
    if (!route) return;
    setOrdering(true);
    try {
      const { invoices, placed, missing } = orderInvoicesByProximity(route.invoices, coordsIndex, depot);
      const updated = { ...route, invoices };
      await saveRoute(updated);
      setRoute(updated);
      window.alert(
        missing > 0
          ? `Se ordenaron ${placed} facturas por cercanía. ${missing} se dejaron al final porque su código no tiene coordenada guardada.`
          : `Se ordenaron las ${placed} facturas por cercanía.`
      );
    } finally {
      setOrdering(false);
    }
  }

  async function moveInvoice(id, dir) {
    if (!route) return;
    const idx = route.invoices.findIndex((i) => i.id === id);
    const j = idx + dir;
    if (idx < 0 || j < 0 || j >= route.invoices.length) return;
    const next = route.invoices.slice();
    [next[idx], next[j]] = [next[j], next[idx]];
    const updated = { ...route, invoices: next };
    await saveRoute(updated);
    setRoute(updated);
  }

  async function handleRebuildSearchIndex() {
    if (!window.confirm("Esto revisa todas las rutas existentes: actualiza el buscador de Ventas, los contadores de progreso y saca a otro lugar las fotos que hayan quedado guardadas dentro de rutas viejas. Puede tardar un momento y solo hace falta ejecutarlo una vez. ¿Continuar?")) return;
    setRebuilding(true);
    try {
      const { invoices, photosFlattened, migrated } = await rebuildSearchIndex();
      window.alert(
        `Listo. Índice actualizado (${invoices} facturas)` +
        `${photosFlattened ? `, ${photosFlattened} foto(s) separadas de sus rutas` : ""}` +
        `${migrated ? `, ${migrated} ruta(s) migradas al nuevo formato` : ""}.`
      );
    } catch (err) {
      window.alert("No se pudo completar el mantenimiento: " + (err && err.message ? err.message : err));
    } finally {
      setRebuilding(false);
    }
  }

  async function createRoute(name, driverName) {
    const r = { id: newId("route"), name, driverName, createdAt: Date.now(), invoices: [] };
    await saveRoute(r);
    await setIndexEntry(r.id, { id: r.id, name, driverName, driverKey: driverKey(driverName), createdAt: r.createdAt, total: 0, ok: 0, bad: 0, liqOk: 0, liqBad: 0 });
    setSelectedId(r.id);
    setShowNewRoute(false);
  }

  async function importRoutes(groupsWithDriver) {
    // groupsWithDriver: [{ code, locality, driverName, routeName, invoices }]
    const newRoutesMeta = [];
    for (const g of groupsWithDriver) {
      const route = {
        id: newId("route"),
        name: g.routeName,
        driverName: g.driverName,
        createdAt: Date.now(),
        invoices: g.invoices.map((inv) => ({
          id: newId("inv"),
          factura: inv.factura || "",
          pedido: inv.pedido || "",
          destino: inv.destino || "",
          cliente: inv.cliente,
          direccion: inv.direccion,
          fecha: inv.fecha || "",
          status: "pendiente",
          hasPhoto: false,
          comment: null,
          updatedAt: Date.now(),
        })),
      };
      await saveRoute(route);
      await syncSearchIndex(route);
      newRoutesMeta.push({ id: route.id, name: route.name, driverName: route.driverName, driverKey: driverKey(route.driverName), createdAt: route.createdAt, ...routeCounts(route.invoices), ...liqCounts(route.invoices) });
    }
    const map = {};
    newRoutesMeta.forEach((r) => { map[`${INDEX_KEY}/${r.id}`] = r; });
    await window.storage.update(map);
    setShowImport(false);
  }

  async function addInvoice(data) {
    if (!route) return;
    const inv = {
      id: newId("inv"), factura: data.factura || "", pedido: data.pedido || "", destino: "",
      cliente: data.cliente, direccion: data.direccion, fecha: "",
      status: "pendiente", hasPhoto: false, comment: null, updatedAt: Date.now(),
    };
    const updated = { ...route, invoices: [...route.invoices, inv] };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await patchIndexEntry(route.id, routeCounts(updated.invoices));
    setShowNewInvoice(false);
  }

  async function updateInvoice(id, data) {
    const updated = {
      ...route,
      invoices: route.invoices.map((inv) => (inv.id === id ? { ...inv, ...data } : inv)),
    };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await patchIndexEntry(route.id, routeCounts(updated.invoices));
    setEditingInvoice(null);
  }

  async function deleteInvoice(id) {
    if (!window.confirm("¿Eliminar esta factura de la ruta? No se puede deshacer.")) return;
    const updated = { ...route, invoices: route.invoices.filter((inv) => inv.id !== id) };
    await saveRoute(updated);
    setRoute(updated);
    await removeInvoiceFromSearchIndex(id);
    await deletePhoto(id);
    await patchIndexEntry(route.id, routeCounts(updated.invoices));
  }

  async function resetInvoiceStatus(id) {
    if (!window.confirm("¿Marcar esta factura como Pendiente de nuevo? Se borrará la foto, el comentario y la ubicación guardados.")) return;
    await deletePhoto(id);
    await updateInvoice(id, { status: "pendiente", hasPhoto: false, comment: null, location: null });
  }

  async function removeRoute(id) {
    if (!window.confirm("¿Eliminar esta ruta completa, con todas sus facturas? No se puede deshacer.")) return;
    if (route && route.id === id) {
      await removeRouteFromSearchIndex(route);
      await Promise.all(route.invoices.map((inv) => deletePhoto(inv.id)));
      if (route.liquidacion && route.liquidacion.attachment) await deletePhoto(`liq-${route.id}`);
    }
    await deleteRouteData(id);
    await removeIndexEntry(id);
    setSelectedId(null);
  }

  async function updateRouteMeta(name, driverName, dateStr) {
    let createdAt = route.createdAt;
    if (dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      const dt = new Date(route.createdAt);
      dt.setFullYear(y, m - 1, d);
      createdAt = dt.getTime();
    }
    const updated = { ...route, name, driverName, createdAt };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await patchIndexEntry(route.id, { name, driverName, driverKey: driverKey(driverName), createdAt });
    setEditingRoute(false);
  }

  /* El chofer se llevó pedidos pendientes y los va a entregar otro día:
     NO se marcan como fallidos (sí se van a entregar, solo que después)
     — simplemente se "revive" la ruta con la fecha de hoy, conservando
     intactas las facturas que ya se entregaron o fallaron, para que
     vuelva a aparecer arriba en "Rutas de hoy" del chofer. */
  async function moveRouteToToday() {
    if (!window.confirm(`¿Pasar "${route.name}" a la fecha de hoy? Las facturas ya entregadas o falladas quedan tal cual — solo se mueve la fecha de la ruta.`)) return;
    await updateRouteMeta(route.name, route.driverName, new Date().toISOString().slice(0, 10));
  }

  /* Para cuando esas entregas de plano ya no van a pasar desde esta
     ruta: cierra de un jalón todas las facturas que sigan pendientes,
     marcándolas como no entregadas con un motivo compartido. */
  async function closePendingAsFallido(reason) {
    const updated = {
      ...route,
      invoices: route.invoices.map((inv) =>
        inv.status === "pendiente"
          ? { ...inv, status: "fallido", comment: reason, updatedAt: Date.now() }
          : inv
      ),
    };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await patchIndexEntry(route.id, routeCounts(updated.invoices));
    setShowClosePending(false);
  }

  if (route) {
    return (
      <div className="lg-root min-h-screen">
        <GlobalStyle />
        <Header
          title={route.name}
          subtitle={`Asignada a ${route.driverName}`}
          onBack={() => setSelectedId(null)}
          dark
          right={
            <div className="flex items-center gap-1">
              <button className="lg-icon-btn" style={{ borderColor: "transparent", background: "transparent", color: "#fff" }}
                onClick={() => setEditingRoute(true)} title="Editar ruta">
                <Pencil size={18} />
              </button>
              <button className="lg-icon-btn" style={{ borderColor: "transparent", background: "transparent", color: "#fff" }}
                onClick={() => removeRoute(route.id)} title="Eliminar ruta">
                <Trash size={18} />
              </button>
            </div>
          }
        />
        <div className="max-w-lg mx-auto px-4 py-5">
          <div className="lg-card p-4 mb-5">
            <ProgressBar invoices={route.invoices} />
          </div>

          {(() => {
            const { total, ok, bad } = routeCounts(route.invoices);
            const pending = total - ok - bad;
            if (pending <= 0) return null;
            return (
              <div className="lg-card p-3.5 mb-5" style={{ background: "var(--warn-bg)" }}>
                <p className="text-sm font-semibold flex items-center gap-1.5 mb-2" style={{ color: "var(--warn)" }}>
                  <AlertTriangle size={15} /> {pending} factura{pending === 1 ? "" : "s"} sin procesar en esta ruta
                </p>
                <div className="flex flex-col gap-2">
                  <button className="lg-btn lg-btn-brand text-sm" onClick={moveRouteToToday}>
                    <Truck size={16} /> El chofer se las lleva — pasar la ruta a hoy
                  </button>
                  <button className="lg-btn lg-btn-ghost text-sm" onClick={() => setShowClosePending(true)}>
                    Ya no se van a entregar — cerrar como no entregadas
                  </button>
                </div>
              </div>
            );
          })()}

          {showClosePending && (
            <ClosePendingSheet
              count={routeCounts(route.invoices).total - routeCounts(route.invoices).ok - routeCounts(route.invoices).bad}
              onCancel={() => setShowClosePending(false)}
              onConfirm={closePendingAsFallido}
            />
          )}

          <div className="flex items-center justify-between mb-3 gap-2">
            <h2 className="font-semibold">Facturas ({route.invoices.length})</h2>
            <div className="flex gap-2">
              <button
                className="lg-btn lg-btn-ghost !py-2 !px-3 text-sm"
                disabled={ordering || route.invoices.length < 2}
                onClick={handleOrderByProximity}
                title={`Ordena desde ${depot.label}, en línea recta`}
              >
                <MapPin size={16} /> {ordering ? "Ordenando…" : "Ordenar por cercanía"}
              </button>
              <button className="lg-btn lg-btn-brand !py-2 !px-3 text-sm" onClick={() => setShowNewInvoice(true)}>
                <Plus size={16} /> Agregar
              </button>
            </div>
          </div>

          <MissingCoordsBanner invoices={route.invoices} coordsIndex={coordsIndex} />

          <div className="flex flex-col gap-2.5">
            {route.invoices.length === 0 && (
              <EmptyState text="Todavía no hay facturas en esta ruta. Agrega la primera." />
            )}
            {route.invoices.map((inv, idx) => (
              <div key={inv.id} className="lg-card p-3.5">
                <div className="flex items-start justify-between gap-2">
                  <div className="flex items-start gap-2 min-w-0">
                    <div className="flex flex-col items-center gap-0.5 shrink-0 pt-0.5">
                      <button
                        className="lg-icon-btn !w-6 !h-6"
                        style={{ opacity: idx === 0 ? 0.3 : 1 }}
                        disabled={idx === 0}
                        title="Mover antes"
                        onClick={() => moveInvoice(inv.id, -1)}
                      >
                        <ChevronUp size={14} />
                      </button>
                      <span className="lg-mono text-xs font-semibold" style={{ color: "var(--muted)" }}>{idx + 1}</span>
                      <button
                        className="lg-icon-btn !w-6 !h-6"
                        style={{ opacity: idx === route.invoices.length - 1 ? 0.3 : 1 }}
                        disabled={idx === route.invoices.length - 1}
                        title="Mover después"
                        onClick={() => moveInvoice(inv.id, 1)}
                      >
                        <ChevronDown size={14} />
                      </button>
                    </div>
                    <div className="min-w-0">
                    <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(inv)}</p>
                    <p className="font-semibold truncate">{inv.cliente}</p>
                    <p className="text-sm truncate" style={{ color: "var(--muted)" }}>
                      <MapPin size={12} className="inline mr-1 -mt-0.5" />{inv.direccion}
                    </p>
                    {isRecoleccion(inv) && <div className="mt-1"><RecoleccionTag /></div>}
                    {(!String(inv.destino || "").trim() || !coordsIndex[String(inv.destino).trim()]) && (
                      <p className="text-xs mt-1 font-medium" style={{ color: "var(--warn)" }}>
                        <AlertTriangle size={11} className="inline mr-1 -mt-0.5" />
                        {String(inv.destino || "").trim() ? `Sin coordenada guardada (Cód. ${inv.destino})` : "Sin código de destino"}
                      </p>
                    )}
                    {((inv.factura && inv.pedido) || inv.destino || inv.fecha) && (
                      <p className="lg-mono text-xs mt-1" style={{ color: "var(--muted)" }}>
                        {inv.factura && inv.pedido && <>Pedido {inv.pedido}</>}
                        {inv.destino && <> · Cód. {inv.destino}</>}
                        {inv.fecha && <> · {inv.fecha}</>}
                      </p>
                    )}
                    </div>
                  </div>
                  <div className="flex flex-col items-end gap-1.5 shrink-0">
                    <StatusPill status={inv.status} />
                    {inv.liqStatus && inv.liqStatus !== "pendiente" && <LiqStatusPill status={inv.liqStatus} />}
                    <div className="flex gap-1">
                      <button className="lg-icon-btn" title="Editar" onClick={() => setEditingInvoice(inv)}>
                        <Pencil size={14} />
                      </button>
                      {inv.status !== "pendiente" && (
                        <button className="lg-icon-btn" title="Marcar como pendiente" onClick={() => resetInvoiceStatus(inv.id)}>
                          <Undo2 size={14} />
                        </button>
                      )}
                      <button className="lg-icon-btn lg-icon-btn-danger" title="Eliminar" onClick={() => deleteInvoice(inv.id)}>
                        <Trash size={14} />
                      </button>
                    </div>
                  </div>
                </div>
                {inv.status === "fallido" && inv.comment && (
                  <p className="text-sm mt-2 rounded-md p-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
                    <MessageSquare size={13} className="inline mr-1 -mt-0.5" />{inv.comment}
                  </p>
                )}
                {inv.status === "entregado" && inv.faltante && (
                  <p className="text-sm mt-2 rounded-md p-2" style={{ background: "var(--warn-bg)", color: "var(--warn)" }}>
                    <AlertTriangle size={13} className="inline mr-1 -mt-0.5" />Faltante: {inv.incidencia || "sin detalle"}
                  </p>
                )}
                {inv.status === "fallido" && (inv.hasPhoto || inv.photo) && (
                  <div className="mt-2 flex items-center gap-3 flex-wrap">
                    <EvidenceButton photoId={inv.id} inlineSrc={inv.photo || null} label="Ver formato de devolución" downloadName={`devolucion_${invoiceFileTag(inv)}.jpg`} />
                    {inv.location && (
                      <a href={mapsLink(inv.location)} target="_blank" rel="noreferrer" className="text-xs font-medium underline" style={{ color: "var(--brand)" }}>
                        Ver ubicación
                      </a>
                    )}
                    <span className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{formatDateTime(inv.updatedAt)}</span>
                  </div>
                )}
                {inv.status === "entregado" && (inv.hasPhoto || inv.photo) && (
                  <div className="mt-2 flex items-center gap-3 flex-wrap">
                    <EvidenceButton photoId={inv.id} inlineSrc={inv.photo || null} label="Ver evidencia" downloadName={`${invoiceFileTag(inv)}.jpg`} />
                    {inv.location && (
                      <a href={mapsLink(inv.location)} target="_blank" rel="noreferrer" className="text-xs font-medium underline" style={{ color: "var(--brand)" }}>
                        Ver ubicación
                      </a>
                    )}
                    <span className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{formatDateTime(inv.updatedAt)}</span>
                  </div>
                )}
                <LiqDetailBlock inv={inv} />
              </div>
            ))}
          </div>
        </div>

        {showNewInvoice && (
          <InvoiceFormSheet onCancel={() => setShowNewInvoice(false)} onSave={addInvoice} />
        )}
        {editingInvoice && (
          <InvoiceFormSheet
            initial={editingInvoice}
            onCancel={() => setEditingInvoice(null)}
            onSave={(data) => updateInvoice(editingInvoice.id, data)}
          />
        )}
        {editingRoute && (
          <NewRouteSheet
            initial={route}
            onCancel={() => setEditingRoute(false)}
            onSave={updateRouteMeta}
          />
        )}
      </div>
    );
  }

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title="Panel de despacho" subtitle="Rutas activas" onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5">
        <div className="flex gap-2.5 mb-5">
          <button className="lg-btn lg-btn-brand flex-1" onClick={() => setShowNewRoute(true)}>
            <Plus size={18} /> Nueva ruta
          </button>
          <button className="lg-btn lg-btn-ghost flex-1" onClick={() => setShowImport(true)}>
            <FileSpreadsheet size={18} /> Importar Excel
          </button>
        </div>

        <button
          type="button"
          className="lg-btn lg-btn-ghost w-full mb-5 text-xs"
          disabled={rebuilding}
          onClick={handleRebuildSearchIndex}
          title="Solo necesario una vez: actualiza el buscador de Ventas, los contadores de progreso y separa las fotos de rutas creadas antes de esta actualización"
        >
          {rebuilding ? "Actualizando…" : "Mantenimiento del índice (una sola vez)"}
        </button>

        <div className="lg-card p-3.5 mb-5">
          <div className="flex items-center justify-between mb-2">
            <p className="text-sm font-semibold">Ruteo por cercanía</p>
            <span className="text-xs" style={{ color: "var(--muted)" }}>
              {Object.keys(coordsIndex).length} código{Object.keys(coordsIndex).length === 1 ? "" : "s"} con coordenada
            </span>
          </div>
          <button type="button" className="lg-btn lg-btn-ghost w-full text-sm mb-2" onClick={() => setShowImportCoords(true)}>
            <FileSpreadsheet size={16} /> Importar coordenadas (Excel/CSV)
          </button>
          <button type="button" className="lg-btn lg-btn-ghost w-full text-sm mb-2" onClick={() => setShowMissing(true)}>
            <AlertTriangle size={16} /> Ver códigos sin coordenada
          </button>
          {!editingDepot ? (
            <button type="button" className="lg-btn lg-btn-ghost w-full text-sm" onClick={() => setEditingDepot(true)}>
              <MapPin size={16} /> Punto de partida: {depot.label}
            </button>
          ) : (
            <DepotEditForm depot={depot} onCancel={() => setEditingDepot(false)} onSave={handleSaveDepot} />
          )}
        </div>

        {showImportCoords && (
          <ImportCoordsSheet onCancel={() => setShowImportCoords(false)} onImport={handleImportCoords} />
        )}
        {showMissing && (
          <MissingCoordsSheet coordsIndex={coordsIndex} onClose={() => setShowMissing(false)} />
        )}

        <div className="flex flex-col gap-3">
          {index.length === 0 && <EmptyState text="Aún no has creado ninguna ruta." />}
          {(() => {
            const todayRoutes = index.filter((r) => isToday(r.createdAt));
            const previousRoutes = index.filter((r) => !isToday(r.createdAt));
            return (
              <React.Fragment>
                {todayRoutes.length > 0 && (
                  <div className="flex flex-col gap-3">
                    {todayRoutes.map((r) => (
                      <RouteRow key={r.id} r={r} onClick={() => setSelectedId(r.id)} />
                    ))}
                  </div>
                )}
                {previousRoutes.length > 0 && (
                  <div className="mt-2">
                    <button
                      type="button"
                      className="lg-btn lg-btn-ghost w-full"
                      onClick={() => setShowPrevious((v) => !v)}
                    >
                      {showPrevious ? "Ocultar" : "Mostrar"} rutas anteriores ({previousRoutes.length})
                    </button>
                    {showPrevious && (() => {
                      const { dayGroups, weekGroups } = groupPreviousRoutes(previousRoutes);
                      return (
                        <div className="flex flex-col gap-2.5 mt-3">
                          {dayGroups.map(([key, group]) => (
                            <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                          ))}
                          {weekGroups.map(([key, group]) => (
                            <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                )}
              </React.Fragment>
            );
          })()}
        </div>
      </div>

      {showNewRoute && (
        <NewRouteSheet onCancel={() => setShowNewRoute(false)} onSave={createRoute} />
      )}
      {showImport && (
        <ImportExcelSheet onCancel={() => setShowImport(false)} onImport={importRoutes} />
      )}
    </div>
  );
}

function ImportExcelSheet({ onCancel, onImport }) {
  const [step, setStep] = useState("upload"); // upload | preview | error
  const [parsed, setParsed] = useState(null); // { groups, skipped, totalRows }
  const [assignments, setAssignments] = useState({}); // code -> { driverName, routeName }
  const [errorMsg, setErrorMsg] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    setErrorMsg("");
    try {
      const result = await parseRoutesExcel(file);
      if (result.groups.length === 0) {
        setErrorMsg(
          `No se encontraron filas con Ruta y Factura/Pedido válidos en el archivo. ` +
          `Hoja revisada: "${result.sheetName}" (hojas en el archivo: ${result.sheetNames.join(", ") || "ninguna"}). ` +
          `Columnas detectadas: ${result.headers.join(", ") || "no se detectó ninguna columna"}.`
        );
        setStep("error");
      } else {
        setParsed(result);
        const initial = {};
        result.groups.forEach((g) => {
          const ztName = ZT_NAMES[g.code];
          initial[g.code] = { driverName: "", routeName: ztName ? `${g.code} · ${ztName}` : `${g.code} — ${g.locality}` };
        });
        setAssignments(initial);
        setStep("preview");
      }
    } catch (err) {
      setErrorMsg(`No se pudo leer el archivo: ${err?.message || "error desconocido"}. Verifica que sea un .xlsx o .csv válido.`);
      setStep("error");
    } finally {
      setBusy(false);
    }
  }

  function updateAssignment(code, field, value) {
    setAssignments((prev) => ({ ...prev, [code]: { ...prev[code], [field]: value } }));
  }

  const allAssigned = parsed?.groups.every((g) => assignments[g.code]?.driverName?.trim());

  function confirmImport() {
    const groupsWithDriver = parsed.groups.map((g) => ({
      code: g.code,
      locality: g.locality,
      invoices: g.invoices,
      driverName: assignments[g.code].driverName.trim(),
      routeName: assignments[g.code].routeName.trim() || `${g.code} — ${g.locality}`,
    }));
    onImport(groupsWithDriver);
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 560 }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Importar rutas desde Excel</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>

        {step === "upload" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Sube el reporte de despacho (.xlsx o .csv). Se reconocen las columnas
              <span className="lg-mono"> Ruta</span>, <span className="lg-mono">Ruta Texto</span>,
              <span className="lg-mono"> Pedido</span>, <span className="lg-mono">Factura</span>,
              <span className="lg-mono"> Fecha salida mcías.</span>, <span className="lg-mono">Destinatario mcía.</span> y{" "}
              <span className="lg-mono">Nombre destinatario de mercancías</span>. Cada código de Ruta se
              agrupa como una ruta nueva; la población (Ruta Texto) se guarda como referencia de cada entrega.
            </p>
            <label className="lg-card flex flex-col items-center justify-center gap-2 py-9 cursor-pointer" style={{ borderStyle: "dashed" }}>
              <Upload size={26} style={{ color: "var(--muted)" }} />
              <span className="text-sm font-medium">{busy ? "Leyendo archivo…" : "Seleccionar archivo"}</span>
              <input type="file" accept=".xlsx,.xls,.csv" className="lg-file-input" onChange={handleFile} disabled={busy} />
            </label>
          </div>
        )}

        {step === "error" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm rounded-md p-3 flex items-start gap-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
              <AlertTriangle size={16} className="mt-0.5 shrink-0" /> {errorMsg}
            </p>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Intentar de nuevo</button>
          </div>
        )}

        {step === "preview" && parsed && (
          <div className="flex flex-col gap-4">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Se encontraron <b>{parsed.groups.reduce((a, g) => a + g.invoices.length, 0)}</b> facturas
              en <b>{parsed.groups.length}</b> rutas
              {parsed.skipped > 0 && <> · {parsed.skipped} filas se omitieron por no tener Ruta ni Factura/Pedido</>}.
              Asigna un chofer a cada ruta para poder importarlas.
            </p>

            <div className="flex flex-col gap-3 max-h-[45vh] overflow-y-auto pr-0.5">
              {parsed.groups.map((g) => (
                <div key={g.code} className="lg-card p-3.5">
                  <div className="flex items-center justify-between mb-2">
                    <span className="lg-mono text-sm font-semibold">{g.code}</span>
                    <span className="text-xs" style={{ color: "var(--muted)" }}>{g.invoices.length} facturas</span>
                  </div>
                  <input
                    className="lg-input mb-2 text-sm"
                    value={assignments[g.code]?.routeName || ""}
                    onChange={(e) => updateAssignment(g.code, "routeName", e.target.value)}
                    placeholder="Nombre de la ruta"
                  />
                  <DriverPicker
                    value={assignments[g.code]?.driverName || ""}
                    onChange={(v) => updateAssignment(g.code, "driverName", v)}
                    placeholder="Chofer (obligatorio)"
                  />
                </div>
              ))}
            </div>

            <button className="lg-btn lg-btn-brand" disabled={!allAssigned} onClick={confirmImport}>
              Importar {parsed.groups.length} ruta{parsed.groups.length === 1 ? "" : "s"}
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Elegir otro archivo</button>
          </div>
        )}
      </div>
    </div>
  );
}

function ImportCoordsSheet({ onCancel, onImport }) {
  const [step, setStep] = useState("upload"); // upload | preview | error
  const [parsed, setParsed] = useState(null); // { rows, skipped, totalRows }
  const [errorMsg, setErrorMsg] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    setErrorMsg("");
    try {
      const result = await parseCoordsExcel(file);
      if (!result || result.rows.length === 0) {
        setErrorMsg(
          `No se encontraron filas con Código, Latitud y Longitud válidos. ` +
          `Hoja revisada: "${result?.sheetName || "—"}" (hojas en el archivo: ${result?.sheetNames?.join(", ") || "ninguna"}).`
        );
        setStep("error");
      } else {
        setParsed(result);
        setStep("preview");
      }
    } catch (err) {
      setErrorMsg(`No se pudo leer el archivo: ${err?.message || "error desconocido"}. Verifica que sea un .xlsx o .csv válido.`);
      setStep("error");
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>

          <h3 className="font-semibold text-lg">Importar coordenadas desde Excel</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>

        {step === "upload" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Sube tu tabla de coordenadas (.xlsx o .csv) con las columnas{" "}
              <span className="lg-mono">Código</span>, <span className="lg-mono">Latitud</span> y{" "}
              <span className="lg-mono">Longitud</span>. Un código por fila (sea de cliente o de
              destino) — se guardan aparte, así que puedes volver a subir el archivo después con más
              filas sin perder las que ya tenías.
            </p>
            <label className="lg-card flex flex-col items-center justify-center gap-2 py-9 cursor-pointer" style={{ borderStyle: "dashed" }}>
              <Upload size={26} style={{ color: "var(--muted)" }} />

        )}

        {step === "error" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm rounded-md p-3 flex items-start gap-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
              <AlertTriangle size={16} className="mt-0.5 shrink-0" /> {errorMsg}
            </p>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Intentar de nuevo</button>
          </div>
        )}

        {step === "preview" && parsed && (
          <div className="flex flex-col gap-4">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Se encontraron <b>{parsed.rows.length}</b> códigos con coordenadas válidas
              {parsed.skipped > 0 && <> · {parsed.skipped} filas se omitieron por no tener código o coordenadas válidas</>}.
            </p>
            <div className="flex flex-col gap-1.5 max-h-[40vh] overflow-y-auto pr-0.5">
              {parsed.rows.slice(0, 200).map((r) => (
                <div key={r.codigo} className="flex items-center justify-between text-sm py-1.5 px-2 rounded-md" style={{ background: "var(--paper)" }}>
                  <span className="lg-mono font-medium">{r.codigo}</span>
                  <span className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{r.lat.toFixed(5)}, {r.lng.toFixed(5)}</span>
                </div>
              ))}
              {parsed.rows.length > 200 && (
                <p className="text-xs text-center mt-1" style={{ color: "var(--muted)" }}>y {parsed.rows.length - 200} más…</p>
              )}
            </div>
            <button className="lg-btn lg-btn-brand" onClick={() => onImport(parsed.rows)}>
              Guardar {parsed.rows.length} coordenada{parsed.rows.length === 1 ? "" : "s"}
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Elegir otro archivo</button>
          </div>
        )}
      </div>
    </div>
  );
}

function ClosePendingSheet({ count, onCancel, onConfirm }) {
  const [reason, setReason] = useState("");
  const [busy, setBusy] = useState(false);

  async function confirm() {
    if (!reason.trim()) return;
    setBusy(true);
    try { await onConfirm(reason.trim()); } finally { setBusy(false); }
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Cerrar {count} factura{count === 1 ? "" : "s"} pendiente{count === 1 ? "" : "s"}</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>
        <p className="text-sm mb-3" style={{ color: "var(--muted)" }}>
          Se marcarán como <b>No entregado</b> todas las facturas que sigan pendientes en esta ruta. Esto no se puede deshacer — solo úsalo si esas entregas de verdad ya no van a pasar desde aquí.
        </p>
        <label className="text-sm font-medium">Motivo (obligatorio)</label>
        <textarea
          className="lg-input mt-1" rows={3} autoFocus value={reason}
          onChange={(e) => setReason(e.target.value)}
          placeholder="Ej. pedido cancelado por el cliente, ruta descontinuada…"
        />
        <button className="lg-btn lg-btn-bad mt-3" disabled={busy || !reason.trim()} onClick={confirm}>
          {busy ? "Cerrando…" : "Cerrar como no entregadas"}
        </button>
      </div>
    </div>
  );
}

/* Indicador de liquidación de la ruta completa, calculado a partir de
   las facturas individuales (no del estatus manual de la ruta). Muestra
   lo más urgente primero: si hay alguna no liquidada, eso; si no, las
   pendientes; si ya no queda nada, el 100%. */
function LiquidacionSummaryTag({ total = 0, liqOk = 0, liqBad = 0 }) {
  if (!total) return null;
  const pending = Math.max(0, total - liqOk - liqBad);
  if (liqBad > 0) {
    return (
      <span className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full"
        style={{ background: "var(--bad-bg)", color: "var(--bad)", border: "1.5px solid var(--bad)" }}>
        <XCircle size={12} /> {liqBad} factura{liqBad === 1 ? "" : "s"} no liquidada{liqBad === 1 ? "" : "s"}
      </span>
    );
  }
  if (pending > 0) {
    return (
      <span className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full"
        style={{ background: "var(--warn-bg)", color: "var(--warn)", border: "1.5px solid var(--warn)" }}>
        <Clock size={12} /> {pending} pendiente{pending === 1 ? "" : "s"} de liquidar
      </span>
    );
  }
  return (
    <span className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full"
      style={{ background: "var(--ok-bg)", color: "var(--ok)", border: "1.5px solid var(--ok)" }}>
      <CheckCircle2 size={12} /> Liquidada al 100%
    </span>
  );
}
