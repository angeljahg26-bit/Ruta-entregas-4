  /* Si la URL no trae el parámetro "v", redirige a sí misma agregando
     un valor único (la hora actual). Esto obliga al navegador y al
     servidor de GitHub Pages a entregar siempre la versión más
     reciente del archivo, sin que el usuario tenga que hacer nada. */
  if (!location.search.includes("v=")) {
    location.replace(location.pathname + "?v=" + Date.now());

<script>
  /* Si algo falla al cargar la app, muestra el error en pantalla
     (en vez de dejar la pantalla en blanco) para poder diagnosticarlo. */
  window.addEventListener("error", function (e) {
    function show() {
      const box = document.createElement("pre");
      box.style.cssText = "white-space:pre-wrap;padding:16px;color:#b00020;font-size:14px;font-family:monospace;background:#fff3f3;margin:0;";

      document.body.prepend(box);
    }
    if (document.body) show();
    else document.addEventListener("DOMContentLoaded", show);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    function show() {
      const box = document.createElement("pre");
      box.style.cssText = "white-space:pre-wrap;padding:16px;color:#b00020;font-size:14px;font-family:monospace;background:#fff3f3;margin:0;";

      document.body.prepend(box);
    }
    if (document.body) show();
    else document.addEventListener("DOMContentLoaded", show);
  });
</script>

    /* Guarda los datos en Firebase Realtime Database, así Administrador,
       Liquidación y Choferes ven la misma información sin importar el
       dispositivo o navegador que usen. */
    const firebaseConfig = {
      apiKey: "AIzaSyAFHI2n1bjnG1NR-wcN1Ys-wjFT1ww3EC4",
      authDomain: "infinite-deck-484214-e0.firebaseapp.com",
      databaseURL: "https://infinite-deck-484214-e0-default-rtdb.firebaseio.com",
      projectId: "infinite-deck-484214-e0",
    };

    if (!window.storage) {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const root = db.ref("logistica-app");

      window.storage = {
        async get(key) {
          const snap = await root.child(key).once("value");
          const val = snap.val();
          return val === null || val === undefined ? null : { key, value: val, shared: true };
        },
        async set(key, value) {
          await root.child(key).set(value);
          return { key, value, shared: true };
        },
        async delete(key) {
          await root.child(key).remove();
          return { key, deleted: true, shared: true };
        },
        async list(p = "") {
          const snap = await root.once("value");
          const all = snap.val() || {};
          const keys = Object.keys(all).filter((k) => k.startsWith(p));
          return { keys, prefix: p, shared: true };
        },
        /* Escucha cambios en tiempo real (sin polling): Firebase llama a
           cb(valor) de inmediato con el dato actual y, después, solo cuando
           alguien realmente lo modifica. Devuelve una función para dejar de
           escuchar (llamarla al desmontar el componente o cambiar de ruta). */
        watch(key, cb) {
          const ref = root.child(key);
          const handler = (snap) => cb(snap.val());
          ref.on("value", handler, (err) => console.error("watch()", key, err));
          return () => ref.off("value", handler);
        },
        /* Escritura atómica en varias rutas a la vez, ej:
             { "search-index/inv_1": {...}, "search-index/inv_2": null }
           Un valor `null` borra esa ruta. No afecta nada fuera de las rutas
           indicadas (a diferencia de re-guardar un objeto completo). */
        async update(map) {
          if (!map || Object.keys(map).length === 0) return;
          await root.update(map);
        },
        /* Transacción: fn recibe el valor MÁS RECIENTE del servidor (nunca
           el que tengas en memoria del navegador) y debe devolver el nuevo
           valor. Si dos personas guardan casi al mismo tiempo, Firebase
           reintenta fn solo con la que perdió la carrera — así nadie le
           borra el cambio a nadie. */
        async transact(key, fn) {
          const res = await root.child(key).transaction(fn);
          return res;
        },
      };
    }

/* Cambia una entrada de routes-index usando SIEMPRE el valor más
   reciente del servidor (nunca el `index` que tengas en el estado de
   React). Así, si dos personas guardan casi al mismo tiempo —dos
   choferes, o el admin y un chofer—, ninguno le borra el cambio al
   otro. updateFn recibe el arreglo actual completo y devuelve el
   nuevo. No hace falta llamar setIndex después: los listeners
   watch(INDEX_KEY, ...) ya activos reciben el resultado solos. */
async function updateIndex(updateFn) {
  await window.storage.transact(INDEX_KEY, (raw) => {
    const list = raw ? JSON.parse(raw) : [];
    return JSON.stringify(updateFn(list));
  });
}

/* cualquier cambio de un hijo, si las fotos vivieran dentro del        */
/* objeto de la ruta, CADA cambio de estatus de CUALQUIER factura       */

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* Índice de búsqueda (para VentasView) — SOLO texto, sin fotos.       */
/* Cada factura vive en "search-index/{invId}" como un objeto pequeño */
/* (no como el JSON gigante de la ruta completa), así buscar no        */
/* implica descargar megabytes de imágenes en Base64.                  */
/* ------------------------------------------------------------------ */
const SEARCH_INDEX_KEY = "search-index";

function invoiceSearchEntry(route, inv) {
  return {
    id: inv.id,
    factura: inv.factura || "",
    pedido: inv.pedido || "",
    cliente: inv.cliente || "",
    destino: inv.destino || "",
    direccion: inv.direccion || "",
    status: inv.status || "pendiente",
    comment: inv.comment || null,
    faltante: !!inv.faltante,
    incidencia: inv.incidencia || null,
    hasPhoto: !!(inv.hasPhoto || inv.photo),
    updatedAt: inv.updatedAt || Date.now(),
    routeId: route.id,
    routeName: route.name,
    driverName: route.driverName,
  };
}
/* Reescribe en el índice la entrada de cada factura de esta ruta
   (crear/editar factura, cambiar estatus, renombrar ruta, etc). No
   borra facturas que ya no estén en route.invoices; para eso usa
   removeInvoiceFromSearchIndex / removeRouteFromSearchIndex. */
async function syncSearchIndex(route) {
  const map = {};
  (route.invoices || []).forEach((inv) => {
    map[`${SEARCH_INDEX_KEY}/${inv.id}`] = invoiceSearchEntry(route, inv);
  });
  await window.storage.update(map);
}
async function removeInvoiceFromSearchIndex(invId) {
  await window.storage.update({ [`${SEARCH_INDEX_KEY}/${invId}`]: null });
}
async function removeRouteFromSearchIndex(route) {
  const map = {};
  (route.invoices || []).forEach((inv) => { map[`${SEARCH_INDEX_KEY}/${inv.id}`] = null; });
  await window.storage.update(map);
}
/* Totales de una ruta (entregadas/fallidas/total), sin fotos. Se guardan
   directamente en routes-index para que las tarjetas de ruta (RouteRow)
   puedan pintar la barra de progreso sin tener que descargar la ruta
   completa (con todas sus fotos) solo para contar estatus. */
function routeCounts(invoices) {
  const list = invoices || [];
  return {
    total: list.length,
    ok: list.filter((i) => i.status === "entregado").length,
    bad: list.filter((i) => i.status === "fallido").length,
  };
}
function applyRouteCountsToIndex(list, routeId, invoices) {
  const counts = routeCounts(invoices);
  return list.map((r) => (r.id === routeId ? { ...r, ...counts } : r));
}

/* Migración única (botón de Admin): hace tres cosas sobre TODAS las
   rutas existentes, una sola vez, a demanda —nunca automáticamente ni
   en un timer—:
   1) Reconstruye el índice de búsqueda de Ventas.
   2) Reconstruye los contadores de routes-index (barra de progreso).
   3) Aplana fotos que hayan quedado embebidas dentro de rutas viejas
      (de antes de esta versión): las saca a logistica-fotos/{id} y dep
      deja solo hasPhoto:true en la factura, para que esa ruta deje de
      pesar megabytes cada vez que alguien la abre o alguien más edita
      otra factura de la misma ruta.
   El resultado del índice se combina con updateIndex() (transacción),
   nunca sobrescribiendo el arreglo completo, para no pisar cambios que
   otros usuarios guarden mientras esto corre. */
async function rebuildSearchIndex(onProgress) {
  const idx = await getIndex();
  const map = {};
  const computed = {};
  let photosFlattened = 0;
  for (let i = 0; i < idx.length; i++) {
    const r = await getRoute(idx[i].id);
    if (r) {
      let changed = false;
      const invoices = [];
      for (const inv of (r.invoices || [])) {
        if (inv.photo && !inv.hasPhoto) {
          await savePhoto(inv.id, inv.photo);
          const { photo, ...rest } = inv;
          invoices.push({ ...rest, hasPhoto: true });
          changed = true;
          photosFlattened++;
        } else {
          invoices.push(inv);
        }
      }
      let liquidacion = r.liquidacion;
      if (liquidacion && liquidacion.photo && !(liquidacion.attachment && liquidacion.attachment.name)) {
        await savePhoto(`liq-${r.id}`, liquidacion.photo);
        liquidacion = { ...liquidacion, photo: null, attachment: { name: "foto.jpg", type: "image/jpeg" } };
        changed = true;
        photosFlattened++;
      }
      if (changed) await saveRoute({ ...r, invoices, liquidacion });
      invoices.forEach((inv) => { map[`${SEARCH_INDEX_KEY}/${inv.id}`] = invoiceSearchEntry(r, inv); });
      computed[idx[i].id] = { ...routeCounts(invoices), liquidacionStatus: liquidacion ? liquidacion.status : null };
    }
    if (onProgress) onProgress(i + 1, idx.length);
  }
  await window.storage.update(map);
  await updateIndex((list) => list.map((r) => (computed[r.id] ? { ...r, ...computed[r.id] } : r)));
  return { invoices: Object.keys(map).length, photosFlattened };
}

/* Comprime una foto a base64 (máx 900px, jpeg 0.6) para no exceder límites */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Obtiene la ubicación GPS actual; si el chofer no da permiso o el
   teléfono no puede obtenerla, resuelve null sin romper el flujo. */
function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  });
}

function cleanFolio(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "number") return String(Math.trunc(v));
  return String(v).trim();
}

/* Texto a mostrar como identificador de una factura: prioriza el número
   de Factura; si todavía no la generan, aclara que se muestra el Pedido. */
function invoiceLabel(inv) {
  if (inv.factura) return `#${inv.factura}`;
  if (inv.pedido) return `Pedido ${inv.pedido} (sin factura)`;
  return "Sin folio";
}
function invoiceFileTag(inv) {
  return inv.factura || inv.pedido || inv.id;
}
function mapsLink(loc) {
  return `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
}
/* Fecha y hora exacta en que se guardó una foto/estatus, para poder ver
   el orden real en que el chofer fue completando sus entregas. */
function formatDateTime(ts) {
  if (!ts) return "";
  return new Date(ts).toLocaleString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* Busca una columna por nombre tolerando espacios extra / mayúsculas distintas */
function getField(row, name) {
  if (name in row) return row[name];
  const target = name.trim().toLowerCase();
  const key = Object.keys(row).find((k) => k.trim().toLowerCase() === target);
  return key ? row[key] : "";
}

/*
 * Lee un archivo .xlsx/.csv de rutas y lo agrupa por código de "Ruta".
 * Columnas que reconoce (nombres tal cual el reporte de despacho):
 *   Destinatario mcía. (código de destino), Ruta, Pedido, Factura,
 *   Fecha salida mcías., Ruta Texto (población) y
 *   Nombre destinatario de mercancías (nombre del destino).
 * Si una fila no trae Factura todavía, se usa el Pedido como folio
 * temporal para no perder esa entrega del reporte.
 * Devuelve: [{ code, locality, invoices: [...], skipped }]
 */
async function parseRoutesExcel(file) {
  const isCsv = /\.csv$/i.test(file.name);
  let wb;
  if (isCsv) {
    const text = await file.text();
    wb = XLSX.read(text, { type: "string" });
  } else {
    const buf = await file.arrayBuffer();
    wb = XLSX.read(new Uint8Array(buf), { type: "array" });
  }

  // Revisa TODAS las hojas del archivo (no solo la primera) y se queda
  // con la que produzca más facturas válidas — así no depende de que
  // la hoja se llame "Hoja1" ni de que sea la primera pestaña.
  let best = null;
  for (const sheetName of wb.SheetNames) {
    // Se lee en modo "arreglo de arreglos" y los encabezados se toman
    // manualmente de la primera fila. Esto evita depender de cómo la
    // librería adivina las columnas, que puede variar según cómo se
    // haya generado el archivo .xlsx original.
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: true });
    if (!aoa.length) continue;
    const headers = aoa[0].map((h) => String(h ?? "").trim());
    const rows = aoa
      .slice(1)
      .filter((arr) => arr.some((c) => String(c ?? "").trim() !== ""))
      .map((arr) => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = arr[i] ?? ""; });
        return obj;
      });
    const groups = new Map();
    let skipped = 0;

    for (const row of rows) {
      const code = String(getField(row, "Ruta") || "").trim();
      const factura = cleanFolio(getField(row, "Factura"));
      const pedido = cleanFolio(getField(row, "Pedido"));
      if (!code || (!factura && !pedido)) { skipped++; continue; }

      const destino = cleanFolio(getField(row, "Destinatario mcía."));
      const cliente = String(getField(row, "Nombre destinatario de mercancías") || "Sin nombre").trim();
      const locality = String(getField(row, "Ruta Texto") || "Sin localidad").trim();
      const fecha = String(getField(row, "Fecha salida mcías.") || "").trim();

      if (!groups.has(code)) groups.set(code, { code, locality, invoices: [] });
      const g = groups.get(code);
      g.invoices.push({ factura, pedido, destino, cliente, direccion: locality || "Sin localidad", fecha });
      if (!g.locality) g.locality = locality;
    }

    const groupsArr = Array.from(groups.values());
    const totalInvoices = groupsArr.reduce((a, g) => a + g.invoices.length, 0);
    const bestInvoices = best ? best.groups.reduce((a, g) => a + g.invoices.length, 0) : -1;
    if (totalInvoices > bestInvoices) {
      best = { groups: groupsArr, skipped, totalRows: rows.length, headers, sheetName, sheetNames: wb.SheetNames };
    }
  }

  return best;
}

const STATUS = {
  pendiente: { label: "Pendiente", bg: "var(--pend-bg)", fg: "var(--muted)", border: "var(--line)" },
  entregado: { label: "Entregado", bg: "var(--ok-bg)", fg: "var(--ok)", border: "var(--ok)" },
  fallido: { label: "No entregado", bg: "var(--bad-bg)", fg: "var(--bad)", border: "var(--bad)" },
};

function StatusPill({ status }) {
  const s = STATUS[status] || STATUS.pendiente;
  const Icon = status === "entregado" ? CheckCircle2 : status === "fallido" ? XCircle : Clock;
  return (
    <span
      style={{ background: s.bg, color: s.fg, border: `1.5px solid ${s.border}` }}
      className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full"
    >
      <Icon size={13} /> {s.label}
    </span>
  );
}

function LiquidacionPill({ status }) {
  if (status === "liquidado") {
    return (
      <span className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full"
        style={{ background: "var(--ok-bg)", color: "var(--ok)", border: "1.5px solid var(--ok)" }}>
        <CheckCircle2 size={12} /> Liquidado
      </span>
    );
  }
  return (
    <span className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full"
      style={{ background: "var(--pend-bg)", color: "var(--muted)", border: "1.5px solid var(--line)" }}>
      <Clock size={12} /> Sin liquidar
    </span>
  );
}

function ProgressBar({ invoices, counts }) {
  const c = counts || routeCounts(invoices);
  const total = c.total || 1;
  const ok = c.ok;
  const bad = c.bad;
  const pend = Math.max(0, c.total - ok - bad);
  return (
    <div>
      <div className="flex h-2.5 w-full rounded-full overflow-hidden" style={{ background: "var(--line)" }}>
        <div style={{ width: `${(ok / total) * 100}%`, background: "var(--ok)" }} />
        <div style={{ width: `${(bad / total) * 100}%`, background: "var(--bad)" }} />
      </div>
      <div className="flex gap-3 mt-1.5 text-xs" style={{ color: "var(--muted)" }}>
        <span>{ok} entregadas</span>
        <span>{bad} fallidas</span>
        <span>{pend} pendientes</span>
      </div>
    </div>
  );
}

/* Selector de chofer: lista fija de nombres, con opción de escribir otro
   si despacho necesita asignar a alguien que aún no está en la lista. */
function DriverPicker({ value, onChange, placeholder }) {
  const [custom, setCustom] = useState(Boolean(value) && !DRIVERS.includes(value));
  if (custom) {
    return (
      <div className="flex flex-col gap-1">
        <input
          className="lg-input"
          placeholder={placeholder || "Nombre del chofer"}
          value={value}
          onChange={(e) => onChange(e.target.value)}
        />
        <button type="button" className="text-xs font-medium underline self-start" style={{ color: "var(--brand)" }}
          onClick={() => { setCustom(false); onChange(""); }}>
          Elegir de la lista
        </button>
      </div>
    );
  }
  return (
    <div className="flex flex-col gap-1">
      <select className="lg-input" value={value} onChange={(e) => onChange(e.target.value)}>
        <option value="">{placeholder || "Selecciona un chofer"}</option>
        {DRIVERS.map((d) => <option key={d} value={d}>{d}</option>)}
      </select>
      <button type="button" className="text-xs font-medium underline self-start" style={{ color: "var(--brand)" }}
        onClick={() => setCustom(true)}>
        Escribir otro nombre
      </button>
    </div>
  );
}

function RoleGate({ onEnter }) {
  const [role, setRole] = useState(null);
  const [driverName, setDriverName] = useState("");
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");

  function backToStart() {
    setRole(null);
    setError("");
    setUser("");
    setPass("");
  }

  function tryLogin(accounts, roleName, friendlyName) {
    const key = Object.keys(accounts).find((u) => u.toLowerCase() === user.trim().toLowerCase());
    if (key && accounts[key] === pass) {
      onEnter(roleName, friendlyName || key);
    } else {
      setError("Usuario o contraseña incorrectos.");
    }
  }

  return (
    <div className="lg-root min-h-screen flex flex-col">
      <GlobalStyle />
      <div className="flex-1 flex flex-col justify-center px-6 py-10 max-w-sm mx-auto w-full">
        <div className="flex items-center gap-3 mb-1">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background: "var(--dark)" }}>
            <Truck size={22} color="#fff" />
          </div>
          <div>
            <p className="font-bold text-xl leading-none">MEDICOM</p>
            <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>Ruta y control de entregas</p>
          </div>
        </div>
        <h1 className="text-2xl font-semibold mt-6 mb-1">Entregas del día</h1>
        <p style={{ color: "var(--muted)" }} className="text-sm mb-8">
          Elige cómo vas a entrar. Los datos se comparten entre despacho, liquidación y choferes.
        </p>

        {!role && (
          <div className="flex flex-col gap-3">
            <button className="lg-btn lg-btn-dark !justify-between !py-5" onClick={() => setRole("admin")}>
              <span className="flex items-center gap-3"><ClipboardList size={20} /> Despacho (Administrador)</span>
              <ChevronLeft size={18} className="rotate-180" />
            </button>
            <button className="lg-btn lg-btn-dark2 !justify-between !py-5" onClick={() => setRole("liquidador")}>
              <span className="flex items-center gap-3"><ShieldCheck size={20} /> Liquidación de ruta</span>
              <ChevronLeft size={18} className="rotate-180" />
            </button>
            <button className="lg-btn lg-btn-outline-brand !justify-between !py-5" onClick={() => onEnter("ventas", "Ventas")}>
              <span className="flex items-center gap-3"><FileSpreadsheet size={20} /> Representantes de venta</span>
              <ChevronLeft size={18} className="rotate-180" />
            </button>
            <button className="lg-btn lg-btn-brand !justify-between !py-5" onClick={() => setRole("driver")}>
              <span className="flex items-center gap-3"><Truck size={20} /> Soy chofer</span>
              <ChevronLeft size={18} className="rotate-180" />
            </button>
          </div>
        )}

        {role === "driver" && (
          <div className="flex flex-col gap-3">
            <label className="text-sm font-medium">¿Cuál es tu nombre?</label>
            <DriverPicker value={driverName} onChange={(v) => { setDriverName(v); setError(""); }} placeholder="Selecciona tu nombre" />
            <label className="text-sm font-medium">Contraseña</label>
            <input className="lg-input" type="password" value={pass}
              onChange={(e) => { setPass(e.target.value); setError(""); }} />
            {error && <p className="text-sm" style={{ color: "var(--bad)" }}>{error}</p>}
            <button
              className="lg-btn lg-btn-brand mt-1"
              disabled={!driverName.trim() || !pass}
              onClick={() => {
                const expected = DRIVER_ACCOUNTS[driverName] || DEFAULT_DRIVER_PASSWORD;
                if (pass === expected) onEnter("driver", driverName.trim());
                else setError("Contraseña incorrecta.");
              }}
            >
              Ver mis rutas
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={backToStart}>Regresar</button>
          </div>
        )}

        {(role === "admin" || role === "liquidador") && (
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-sm font-medium">Usuario</label>
              <input className="lg-input mt-1" value={user} autoCapitalize="none" autoFocus
                onChange={(e) => { setUser(e.target.value); setError(""); }} />
            </div>
            <div>
              <label className="text-sm font-medium">Contraseña</label>
              <input className="lg-input mt-1" type="password" value={pass}
                onChange={(e) => { setPass(e.target.value); setError(""); }} />
            </div>
            {error && <p className="text-sm" style={{ color: "var(--bad)" }}>{error}</p>}
            <button
              className="lg-btn lg-btn-brand mt-1"
              disabled={!user.trim() || !pass}
              onClick={() => {
                if (role === "admin") tryLogin(ADMIN_ACCOUNTS, "admin", "Despacho");
                else tryLogin(LIQUIDATOR_ACCOUNTS, "liquidador");
              }}
            >
              Entrar
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={backToStart}>Regresar</button>
          </div>
        )}
      </div>
      <p className="text-center text-xs pb-4" style={{ color: "var(--muted)", opacity: 0.6 }}>
        Desarrollado por JAHG
      </p>
    </div>
  );
}

function AdminView({ onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [showNewRoute, setShowNewRoute] = useState(false);
  const [showNewInvoice, setShowNewInvoice] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [editingRoute, setEditingRoute] = useState(false);
  const [showPrevious, setShowPrevious] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [rebuilding, setRebuilding] = useState(false);

  // Escucha el índice de rutas en tiempo real: Firebase avisa solo cuando
  // alguien crea/borra/renombra una ruta, sin volver a preguntar cada 4s.
  useEffect(() => {
    const unwatch = window.storage.watch(INDEX_KEY, (raw) => {
      setIndex(raw ? JSON.parse(raw) : []);
    });
    return unwatch;
  }, []);
  // Igual para la ruta abierta: solo baja datos nuevos (y sus fotos)
  // cuando esa ruta específica cambia de verdad.
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);

  async function handleRebuildSearchIndex() {
    if (!window.confirm("Esto revisa todas las rutas existentes: actualiza el buscador de Ventas, los contadores de progreso y saca a otro lugar las fotos que hayan quedado guardadas dentro de rutas viejas. Puede tardar un momento y solo hace falta ejecutarlo una vez. ¿Continuar?")) return;
    setRebuilding(true);
    try {
      const { invoices, photosFlattened } = await rebuildSearchIndex();
      window.alert(`Listo. Índice actualizado (${invoices} facturas)${photosFlattened ? `, ${photosFlattened} foto(s) separadas de sus rutas` : ""}.`);
    } catch (err) {
      window.alert("No se pudo completar el mantenimiento: " + (err && err.message ? err.message : err));
    } finally {
      setRebuilding(false);
    }
  }

  async function createRoute(name, driverName) {
    const r = { id: newId("route"), name, driverName, createdAt: Date.now(), invoices: [] };
    await saveRoute(r);
    await updateIndex((list) => [{ id: r.id, name, driverName, createdAt: r.createdAt, total: 0, ok: 0, bad: 0 }, ...list]);
    setSelectedId(r.id);
    setShowNewRoute(false);
  }

  async function importRoutes(groupsWithDriver) {
    // groupsWithDriver: [{ code, locality, driverName, routeName, invoices }]
    const newRoutesMeta = [];
    for (const g of groupsWithDriver) {
      const route = {
        id: newId("route"),
        name: g.routeName,
        driverName: g.driverName,
        createdAt: Date.now(),
        invoices: g.invoices.map((inv) => ({
          id: newId("inv"),
          factura: inv.factura || "",
          pedido: inv.pedido || "",
          destino: inv.destino || "",
          cliente: inv.cliente,
          direccion: inv.direccion,
          fecha: inv.fecha || "",
          status: "pendiente",
          hasPhoto: false,
          comment: null,
          updatedAt: Date.now(),
        })),
      };
      await saveRoute(route);
      await syncSearchIndex(route);
      newRoutesMeta.push({ id: route.id, name: route.name, driverName: route.driverName, createdAt: route.createdAt, ...routeCounts(route.invoices) });
    }
    await updateIndex((list) => [...newRoutesMeta, ...list]);
    setShowImport(false);
  }

  async function addInvoice(data) {
    if (!route) return;
    const inv = {
      id: newId("inv"), factura: data.factura || "", pedido: data.pedido || "", destino: "",
      cliente: data.cliente, direccion: data.direccion, fecha: "",
      status: "pendiente", hasPhoto: false, comment: null, updatedAt: Date.now(),
    };
    const updated = { ...route, invoices: [...route.invoices, inv] };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await updateIndex((list) => applyRouteCountsToIndex(list, route.id, updated.invoices));
    setShowNewInvoice(false);
  }

  async function updateInvoice(id, data) {
    const updated = {
      ...route,
      invoices: route.invoices.map((inv) => (inv.id === id ? { ...inv, ...data } : inv)),
    };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await updateIndex((list) => applyRouteCountsToIndex(list, route.id, updated.invoices));
    setEditingInvoice(null);
  }

  async function deleteInvoice(id) {
    if (!window.confirm("¿Eliminar esta factura de la ruta? No se puede deshacer.")) return;
    const updated = { ...route, invoices: route.invoices.filter((inv) => inv.id !== id) };
    await saveRoute(updated);
    setRoute(updated);
    await removeInvoiceFromSearchIndex(id);
    await deletePhoto(id);
    await updateIndex((list) => applyRouteCountsToIndex(list, route.id, updated.invoices));
  }

  async function resetInvoiceStatus(id) {
    if (!window.confirm("¿Marcar esta factura como Pendiente de nuevo? Se borrará la foto, el comentario y la ubicación guardados.")) return;
    await deletePhoto(id);
    await updateInvoice(id, { status: "pendiente", hasPhoto: false, comment: null, location: null });
  }

  async function removeRoute(id) {
    if (!window.confirm("¿Eliminar esta ruta completa, con todas sus facturas? No se puede deshacer.")) return;
    if (route && route.id === id) {
      await removeRouteFromSearchIndex(route);
      await Promise.all(route.invoices.map((inv) => deletePhoto(inv.id)));
      if (route.liquidacion && route.liquidacion.attachment) await deletePhoto(`liq-${route.id}`);
    }
    await deleteRouteData(id);
    await updateIndex((list) => list.filter((r) => r.id !== id));
    setSelectedId(null);
  }

  async function updateRouteMeta(name, driverName, dateStr) {
    let createdAt = route.createdAt;
    if (dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      const dt = new Date(route.createdAt);
      dt.setFullYear(y, m - 1, d);
      createdAt = dt.getTime();
    }
    const updated = { ...route, name, driverName, createdAt };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await updateIndex((list) => list.map((r) => (r.id === route.id ? { ...r, name, driverName, createdAt } : r)));

function ImportExcelSheet({ onCancel, onImport }) {
  const [step, setStep] = useState("upload"); // upload | preview | error
  const [parsed, setParsed] = useState(null); // { groups, skipped, totalRows }
  const [assignments, setAssignments] = useState({}); // code -> { driverName, routeName }
  const [errorMsg, setErrorMsg] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    setErrorMsg("");
    try {
      const result = await parseRoutesExcel(file);
      if (result.groups.length === 0) {
        setErrorMsg(
          `No se encontraron filas con Ruta y Factura/Pedido válidos en el archivo. ` +
          `Hoja revisada: "${result.sheetName}" (hojas en el archivo: ${result.sheetNames.join(", ") || "ninguna"}). ` +
          `Columnas detectadas: ${result.headers.join(", ") || "no se detectó ninguna columna"}.`
        );
        setStep("error");
      } else {
        setParsed(result);
        const initial = {};
        result.groups.forEach((g) => {
          const ztName = ZT_NAMES[g.code];
          initial[g.code] = { driverName: "", routeName: ztName ? `${g.code} · ${ztName}` : `${g.code} — ${g.locality}` };
        });
        setAssignments(initial);
        setStep("preview");
      }
    } catch (err) {
      setErrorMsg(`No se pudo leer el archivo: ${err?.message || "error desconocido"}. Verifica que sea un .xlsx o .csv válido.`);
      setStep("error");
    } finally {
      setBusy(false);
    }
  }

  function updateAssignment(code, field, value) {
    setAssignments((prev) => ({ ...prev, [code]: { ...prev[code], [field]: value } }));
  }

  const allAssigned = parsed?.groups.every((g) => assignments[g.code]?.driverName?.trim());

  function confirmImport() {
    const groupsWithDriver = parsed.groups.map((g) => ({
      code: g.code,
      locality: g.locality,
      invoices: g.invoices,
      driverName: assignments[g.code].driverName.trim(),
      routeName: assignments[g.code].routeName.trim() || `${g.code} — ${g.locality}`,
    }));
    onImport(groupsWithDriver);
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 560 }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Importar rutas desde Excel</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>

        {step === "upload" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Sube el reporte de despacho (.xlsx o .csv). Se reconocen las columnas
              <span className="lg-mono"> Ruta</span>, <span className="lg-mono">Ruta Texto</span>,
              <span className="lg-mono"> Pedido</span>, <span className="lg-mono">Factura</span>,
              <span className="lg-mono"> Fecha salida mcías.</span>, <span className="lg-mono">Destinatario mcía.</span> y{" "}
              <span className="lg-mono">Nombre destinatario de mercancías</span>. Cada código de Ruta se
              agrupa como una ruta nueva; la población (Ruta Texto) se guarda como referencia de cada entrega.
            </p>
            <label className="lg-card flex flex-col items-center justify-center gap-2 py-9 cursor-pointer" style={{ borderStyle: "dashed" }}>
              <Upload size={26} style={{ color: "var(--muted)" }} />
              <span className="text-sm font-medium">{busy ? "Leyendo archivo…" : "Seleccionar archivo"}</span>
              <input type="file" accept=".xlsx,.xls,.csv" className="lg-file-input" onChange={handleFile} disabled={busy} />
            </label>
          </div>
        )}

        {step === "error" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm rounded-md p-3 flex items-start gap-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
              <AlertTriangle size={16} className="mt-0.5 shrink-0" /> {errorMsg}
            </p>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Intentar de nuevo</button>
          </div>
        )}

        {step === "preview" && parsed && (
          <div className="flex flex-col gap-4">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Se encontraron <b>{parsed.groups.reduce((a, g) => a + g.invoices.length, 0)}</b> facturas
              en <b>{parsed.groups.length}</b> rutas
              {parsed.skipped > 0 && <> · {parsed.skipped} filas se omitieron por no tener Ruta ni Factura/Pedido</>}.
              Asigna un chofer a cada ruta para poder importarlas.
            </p>

            <div className="flex flex-col gap-3 max-h-[45vh] overflow-y-auto pr-0.5">
              {parsed.groups.map((g) => (
                <div key={g.code} className="lg-card p-3.5">
                  <div className="flex items-center justify-between mb-2">
                    <span className="lg-mono text-sm font-semibold">{g.code}</span>
                    <span className="text-xs" style={{ color: "var(--muted)" }}>{g.invoices.length} facturas</span>
                  </div>
                  <input
                    className="lg-input mb-2 text-sm"
                    value={assignments[g.code]?.routeName || ""}
                    onChange={(e) => updateAssignment(g.code, "routeName", e.target.value)}
                    placeholder="Nombre de la ruta"
                  />
                  <DriverPicker
                    value={assignments[g.code]?.driverName || ""}
                    onChange={(v) => updateAssignment(g.code, "driverName", v)}
                    placeholder="Chofer (obligatorio)"
                  />
                </div>
              ))}
            </div>

            <button className="lg-btn lg-btn-brand" disabled={!allAssigned} onClick={confirmImport}>
              Importar {parsed.groups.length} ruta{parsed.groups.length === 1 ? "" : "s"}
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Elegir otro archivo</button>
          </div>
        )}
      </div>
    </div>
  );
}

function LiquidadorView({ name, onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);

  useEffect(() => {
    const unwatch = window.storage.watch(INDEX_KEY, (raw) => {
      setIndex(raw ? JSON.parse(raw) : []);
    });
    return unwatch;
  }, []);
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);

  async function saveLiquidacion(status, motivo, attachment, location) {
    // attachment: null = sin cambios en el archivo adjunto (o ninguno);
    // {dataUrl,name,type} = archivo nuevo — la foto/documento se guarda
    // aparte de la ruta, y en route.liquidacion solo queda su nombre/tipo.
    let attachmentMeta = route.liquidacion?.attachment || null;
    let legacyPhoto = route.liquidacion?.photo || null; // compat con datos de antes de esta versión
    if (attachment) {
      await savePhoto(`liq-${route.id}`, attachment.dataUrl);
      attachmentMeta = { name: attachment.name, type: attachment.type };
      legacyPhoto = null; // ya quedó en el formato nuevo (separado de la ruta)
    }
    const updated = { ...route, liquidacion: { status, motivo: motivo || "", attachment: attachmentMeta, photo: legacyPhoto, location: location || null, by: name, updatedAt: Date.now() } };
    await saveRoute(updated);
    setRoute(updated);
    await updateIndex((list) => list.map((r) => (r.id === updated.id ? { ...r, liquidacionStatus: status } : r)));
  }

  if (route) {
    const fallidas = route.invoices.filter((i) => i.status === "fallido");
    const conFaltante = route.invoices.filter((i) => i.status === "entregado" && i.faltante);
    return (
      <div className="lg-root min-h-screen">
        <GlobalStyle />
        <Header title={route.name} subtitle={`Chofer: ${route.driverName}`} onBack={() => setSelectedId(null)} dark />
        <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-4">
          <div className="lg-card p-4">
            <ProgressBar invoices={route.invoices} />
          </div>

          {fallidas.length > 0 && (
            <div>
              <h2 className="font-semibold mb-2">Devoluciones ({fallidas.length})</h2>
              <div className="flex flex-col gap-2.5">
                {fallidas.map((inv) => (
                  <div key={inv.id} className="lg-card p-3.5">

          <RouteRow key={r.id} r={r} onClick={() => setSelectedId(r.id)} />
        ))}
      </div>
    </div>
  );
}

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function LiquidacionForm({ route, onSave }) {
  const [status, setStatus] = useState(route.liquidacion?.status || "pendiente");
  const [motivo, setMotivo] = useState(route.liquidacion?.motivo || "");
  // Archivo nuevo elegido en esta sesión (con dataUrl en memoria, aún no
  // subido). El adjunto ya guardado NO se precarga — solo se conocen su
  // nombre/tipo (metadatos livianos); el archivo en sí se pide bajo
  // demanda con EvidenceButton, para no bajarlo solo por abrir la ruta.
  const [attachment, setAttachment] = useState(null);
  const existingMeta = route.liquidacion?.attachment || null;
  const legacyInlinePhoto = route.liquidacion?.photo || null; // datos de antes de esta versión
  const [location, setLocation] = useState(route.liquidacion?.location || null);
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(false);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      window.alert("El archivo pesa más de 8 MB. Usa uno más ligero (por ejemplo, comprime el PDF o toma la foto con menor calidad).");
      return;
    }
    setBusy(true);
    try {
      const isImage = file.type.startsWith("image/");
      const [dataUrl, loc] = await Promise.all([
        isImage ? compressImage(file) : readAsDataURL(file),
        getLocation(),
      ]);
      setAttachment({ dataUrl, name: file.name, type: file.type || "application/octet-stream" });
      setLocation(loc);
    } finally {
      setBusy(false);
    }
  }

  async function save() {
    setBusy(true);
    try {
      await onSave(status, motivo, attachment, location);
      setSaved(true);
      setTimeout(() => setSaved(false), 2500);
    } finally {
      setBusy(false);
    }
  }

  const isImageAttachment = attachment?.type?.startsWith("image/");
  const hasAnyAttachment = !!(attachment || existingMeta || legacyInlinePhoto);

  return (
    <div className="lg-card p-4 flex flex-col gap-3">
      <h2 className="font-semibold">Estatus de liquidación</h2>
      <div className="flex gap-2">
        <button type="button" className={`lg-btn flex-1 ${status === "pendiente" ? "lg-btn-dark" : "lg-btn-ghost"}`} onClick={() => setStatus("pendiente")}>
          Pendiente
        </button>
        <button type="button" className={`lg-btn flex-1 ${status === "liquidado" ? "lg-btn-ok" : "lg-btn-ghost"}`} onClick={() => setStatus("liquidado")}>
          Liquidado
        </button>
      </div>
      <div>
        <label className="text-sm font-medium">Motivo / notas (opcional)</label>
        <textarea className="lg-input mt-1" rows={3} value={motivo} onChange={(e) => setMotivo(e.target.value)}
          placeholder="Ej. faltó una devolución por firmar…" />
      </div>
      <div>
        <label className="text-sm font-medium block mb-1">Archivo adjunto (opcional) — foto, PDF u otro documento</label>
        {attachment ? (
          isImageAttachment ? (
            <img src={attachment.dataUrl} alt="evidencia liquidación" className="rounded-lg w-full max-h-48 object-cover" />
          ) : (
            <div className="lg-card p-3 flex items-center gap-3">
              <FileIcon size={22} style={{ color: "var(--muted)" }} />
              <div className="min-w-0">
                <p className="text-sm font-medium truncate">{attachment.name}</p>
                <p className="text-xs" style={{ color: "var(--muted)" }}>{attachment.type}</p>
              </div>
            </div>
          )
        ) : legacyInlinePhoto ? (
          <img src={legacyInlinePhoto} alt="evidencia liquidación" className="rounded-lg w-full max-h-48 object-cover" />
        ) : existingMeta ? (
          <div className="lg-card p-3 flex items-center gap-3">
            <FileIcon size={22} style={{ color: "var(--muted)" }} />
            <div className="min-w-0 flex-1">
              <p className="text-sm font-medium truncate">{existingMeta.name}</p>
              <p className="text-xs" style={{ color: "var(--muted)" }}>{existingMeta.type}</p>
            </div>
            <EvidenceButton photoId={`liq-${route.id}`} mimeType={existingMeta.type} label="Ver" downloadName={existingMeta.name} />
          </div>
        ) : (
          <label className="lg-card flex flex-col items-center justify-center gap-2 py-6 cursor-pointer" style={{ borderStyle: "dashed" }}>
            <Upload size={22} style={{ color: "var(--muted)" }} />
            <span className="text-sm font-medium">Subir foto, PDF u otro archivo</span>
            <input type="file" className="lg-file-input" onChange={handleFile} />
          </label>
        )}
        {hasAnyAttachment && (
          <label className="text-sm font-medium underline cursor-pointer mt-1 inline-block" style={{ color: "var(--brand)" }}>
            Cambiar archivo
            <input type="file" className="lg-file-input" onChange={handleFile} />
          </label>
        )}
        {attachment && (
          <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>
            {location ? "📍 Ubicación capturada junto con el archivo." : "Sin ubicación disponible para este archivo."}
          </p>
        )}
      </div>
      <button className="lg-btn lg-btn-brand" disabled={busy} onClick={save}>
        {busy ? "Guardando…" : saved ? "Guardado ✓" : "Guardar estatus"}
      </button>
    </div>
  );
}

function DriverView({ driverName, onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [activeInvoice, setActiveInvoice] = useState(null); // {invoice, action}
  const [showPrevious, setShowPrevious] = useState(false);

  const myRoutes = index.filter(
    (r) => r.driverName.trim().toLowerCase() === driverName.trim().toLowerCase()
  );
  const myTodayRoutes = myRoutes.filter((r) => isToday(r.createdAt));

  useEffect(() => {
    const unwatch = window.storage.watch(INDEX_KEY, (raw) => {
      setIndex(raw ? JSON.parse(raw) : []);
    });
    return unwatch;
  }, []);
  useEffect(() => {
    if (!selectedId) return;
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);

  async function submitStatus(invoiceId, status, extra) {
    // La foto NUNCA va dentro del objeto de la ruta: si viviera ahí,
    // cada cambio de estatus de CUALQUIER factura obligaría a todos los
    // que tienen esa ruta abierta a re-descargar TODAS sus fotos (RTDB
    // sincroniza el nodo completo ante cualquier cambio de un hijo). Se
    // sube aparte, y en la factura solo queda un booleano.
    const { photo, ...rest } = extra;
    if (photo) await savePhoto(invoiceId, photo);
    const updated = {
      ...route,
      invoices: route.invoices.map((inv) =>
        inv.id === invoiceId ? { ...inv, status, ...rest, hasPhoto: !!photo, updatedAt: Date.now() } : inv
      ),
    };
    await saveRoute(updated);
    setRoute(updated);
    await syncSearchIndex(updated);
    await updateIndex((list) => applyRouteCountsToIndex(list, route.id, updated.invoices));
    setActiveInvoice(null);
  }

  if (route) {
    return (
      <div className="lg-root min-h-screen">
        <GlobalStyle />
        <Header title={route.name} subtitle={`${route.invoices.length} entregas`} onBack={() => (myRoutes.length > 1 ? setSelectedId(null) : onExit())} dark />
        <div className="max-w-lg mx-auto px-4 py-5">
          <div className="lg-card p-4 mb-5">
            <ProgressBar invoices={route.invoices} />
          </div>

          <div className="flex flex-col gap-3">
            {route.invoices.length === 0 && <EmptyState text="Despacho aún no agrega facturas a tu ruta." />}
            {route.invoices.map((inv) => (
              <button
                key={inv.id}
                onClick={() => setActiveInvoice(inv)}
                className="lg-card p-4 text-left w-full active:scale-[0.99] transition-transform"
                style={{ borderLeft: `6px solid ${STATUS[inv.status].fg === "var(--muted)" ? "var(--line)" : STATUS[inv.status].fg}` }}
              >
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(inv)}</p>
                    <p className="font-semibold text-base truncate">{inv.cliente}</p>
                    <p className="text-sm truncate" style={{ color: "var(--muted)" }}>
                      <MapPin size={12} className="inline mr-1 -mt-0.5" />{inv.direccion}
                    </p>
                  </div>
                  <StatusPill status={inv.status} />
                </div>
                {inv.status === "entregado" && inv.faltante && (
                  <p className="text-xs mt-2 rounded-md p-1.5" style={{ background: "var(--warn-bg)", color: "var(--warn)" }}>
                    <AlertTriangle size={12} className="inline mr-1 -mt-0.5" />Reportaste faltante
                  </p>
                )}
              </button>
            ))}
          </div>
        </div>

        {activeInvoice && (
          <InvoiceActionSheet
            invoice={activeInvoice}
            onCancel={() => setActiveInvoice(null)}
            onConfirm={submitStatus}
          />
        )}
      </div>
    );
  }

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title={`Hola, ${driverName}`} subtitle="Tus rutas de hoy" onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-3">
        {myRoutes.length === 0 && <EmptyState text="Todavía no tienes rutas asignadas. Pide a despacho que te asigne una." />}
        {myTodayRoutes.map((r) => (
          <button key={r.id} onClick={() => setSelectedId(r.id)} className="lg-card p-4 text-left w-full flex items-center gap-3">
            <div className="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--brand-light)" }}>
              <Truck size={20} color="var(--dark)" />
            </div>
            <div className="min-w-0">
              <p className="font-semibold truncate">{r.name}</p>
              <p className="text-xs" style={{ color: "var(--muted)" }}>Toca para ver tus entregas</p>
            </div>
          </button>
        ))}
        {(() => {
          const previousRoutes = myRoutes.filter((r) => !isToday(r.createdAt));
          if (previousRoutes.length === 0) return null;
          return (
            <div className="mt-1">
              <button type="button" className="lg-btn lg-btn-ghost w-full" onClick={() => setShowPrevious((v) => !v)}>
                {showPrevious ? "Ocultar" : "Mostrar"} rutas anteriores ({previousRoutes.length})
              </button>
              {showPrevious && (
                <div className="flex flex-col gap-3 mt-3">
                  {previousRoutes.map((r) => (
                    <button key={r.id} onClick={() => setSelectedId(r.id)} className="lg-card p-4 text-left w-full flex items-center gap-3">
                      <div className="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--brand-light)" }}>
                        <Truck size={20} color="var(--dark)" />

                        <p className="font-semibold truncate">{r.name}</p>
                        <p className="text-xs" style={{ color: "var(--muted)" }}>Toca para ver tus entregas</p>
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          );
        })()}
      </div>
    </div>
  );

  const [incidencia, setIncidencia] = useState(invoice.incidencia || "");

  // corregir algo), esta se pide en ese momento — nunca viene ya
  // incluida en la factura, así que no se descarga hasta que hace falta.
  useEffect(() => {
    if (invoice.hasPhoto && !invoice.photo) {
      setLoadingPhoto(true);
      fetchPhoto(invoice.id)
        .then((v) => setPhoto(v))
        .finally(() => setLoadingPhoto(false));
    }
  }, [invoice.id]);

  async function handlePhoto(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    try {
      const [img, loc] = await Promise.all([compressImage(file), getLocation()]);
      setPhoto(img);
      setLocation(loc);
    } finally {
      setBusy(false);
    }

        {mode === "entregado" && (

            ) : (
              <label className="lg-card flex flex-col items-center justify-center gap-2 py-6 cursor-pointer" style={{ borderStyle: "dashed" }}>
                <Camera size={22} style={{ color: "var(--muted)" }} />
                <span className="text-sm font-medium">Foto del formato de devolución (opcional)</span>
                <input type="file" accept="image/*" capture="environment" className="lg-file-input" onChange={handlePhoto} />
              </label>

            {photo && (
              <label className="text-sm font-medium underline text-center cursor-pointer" style={{ color: "var(--brand)" }}>
                Cambiar foto
                <input type="file" accept="image/*" capture="environment" className="lg-file-input" onChange={handlePhoto} />
              </label>
            )}
            {photo && (
              <p className="text-xs text-center" style={{ color: "var(--muted)" }}>
                {location ? "📍 Ubicación capturada junto con la foto." : "Sin ubicación disponible para esta foto."}
              </p>
            )}
            <button
              className="lg-btn lg-btn-bad mt-1"
              disabled={!comment.trim() || busy}
              onClick={() => onConfirm(invoice.id, "fallido", { comment: comment.trim(), photo: photo || null, location })}
            >
              {busy ? "Procesando foto…" : "Confirmar no entrega"}
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={() => setMode(null)}>Regresar</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* Compara la fecha de creación de una ruta contra el día de hoy, para
   separar "Rutas de hoy" de "Rutas anteriores" en cada vista. */
function isToday(ts) {
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

/* Lunes de la semana de una fecha dada (semana laboral lunes–viernes,
   igual que el rol semanal de rutas). */
function startOfWeekMonday(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay(); // 0=domingo … 6=sábado
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d;
}
function dateKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dayLabel(ts) {
  const s = new Date(ts).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
  return `Ruta ${s}`;
}
function weekRangeLabel(ts) {
  const monday = startOfWeekMonday(ts);
  const friday = new Date(monday);
  friday.setDate(friday.getDate() + 4);
  const monthShort = (x) => x.toLocaleDateString("es-MX", { month: "short" }).replace(".", "");
  if (monday.getMonth() === friday.getMonth()) {
    return `Sem. del ${monday.getDate()} al ${friday.getDate()} ${monthShort(friday)}`;
  }
  return `Sem. del ${monday.getDate()} ${monthShort(monday)} al ${friday.getDate()} ${monthShort(friday)}`;
}

/* Encabezado plegable con un cuadrito de color, usado para agrupar
   rutas anteriores por día (semana en curso) o por semana (semanas ya
   cerradas) en la vista de Representantes de venta. */
function CollapsibleRouteGroup({ label, routes, onSelect }) {
  const [open, setOpen] = useState(false);
  return (
    <div>
      <button type="button" className="lg-card p-3.5 w-full flex items-center gap-2.5 text-left" onClick={() => setOpen((v) => !v)}>
        <span className="inline-block rounded-sm shrink-0" style={{ width: 10, height: 10, background: "var(--brand)" }} />
        <span className="font-medium flex-1 truncate">{label}</span>
        <span className="text-xs shrink-0" style={{ color: "var(--muted)" }}>{routes.length}</span>
        <ChevronLeft size={16} style={{ color: "var(--muted)", transform: open ? "rotate(90deg)" : "rotate(-90deg)" }} />
      </button>
      {open && (
        <div className="flex flex-col gap-3 mt-2.5 pl-1">
          {routes.map((r) => (
            <RouteRow key={r.id} r={r} onClick={() => onSelect(r.id)} />
          ))}
        </div>
      )}
    </div>
  );
}

/* Agrupa rutas que no son de hoy: las de esta semana por día, y las de
   semanas ya cerradas por semana completa. Compartido por Despacho y
   Representantes de venta para que se vean igual en ambos lados. */
function groupPreviousRoutes(previousRoutes) {
  const thisWeekMonday = startOfWeekMonday(new Date()).getTime();
  const thisWeekPrevious = previousRoutes.filter((r) => r.createdAt >= thisWeekMonday);
  const olderRoutes = previousRoutes.filter((r) => r.createdAt < thisWeekMonday);

  const byDay = {};
  thisWeekPrevious.forEach((r) => {
    const key = dateKey(r.createdAt);
    if (!byDay[key]) byDay[key] = { label: dayLabel(r.createdAt), routes: [] };
    byDay[key].routes.push(r);
  });
  const dayGroups = Object.entries(byDay).sort((a, b) => (a[0] < b[0] ? 1 : -1));

  const byWeek = {};
  olderRoutes.forEach((r) => {
    const wk = startOfWeekMonday(r.createdAt).getTime();
    if (!byWeek[wk]) byWeek[wk] = { label: weekRangeLabel(r.createdAt), routes: [] };
    byWeek[wk].routes.push(r);
  });
  const weekGroups = Object.entries(byWeek).sort((a, b) => Number(b[0]) - Number(a[0]));

  return { dayGroups, weekGroups };
}

      <GlobalStyle />
      <Header title={route.name} subtitle={`Chofer: ${route.driverName}`} onBack={onBack} dark />

function ImageLightbox({ src, downloadName, onClose }) {
  return (
    <div className="lg-scrim" onClick={onClose} style={{ padding: 16 }}>
      <div className="flex flex-col items-center gap-2" onClick={(e) => e.stopPropagation()}>
        <img src={src} alt="vista previa" style={{ maxWidth: "100%", maxHeight: "82vh", borderRadius: 12 }} />

          {downloadName && (

/* Botón de carga bajo demanda: no descarga la foto/adjunto hasta que el
   usuario lo pide. photoId es la clave en logistica-fotos/{photoId}.
   inlineSrc es solo para compatibilidad con datos de rutas viejas que
   todavía traen la foto embebida (ahí no hace falta pedirla, ya está).
   mimeType decide si se abre en un lightbox (imagen) o se descarga
   directo (PDF u otro archivo). */
function EvidenceButton({ photoId, inlineSrc, mimeType, label = "Ver evidencia", downloadName }) {
  const [state, setState] = useState("idle"); // idle | loading | open | error
  const [src, setSrc] = useState(inlineSrc || null);
  const isImage = !mimeType || mimeType.startsWith("image/");

  async function open() {
    if (src) {
      if (isImage) setState("open");
      else triggerDownload(src);
      return;
    }
    setState("loading");
    try {
      const val = await fetchPhoto(photoId);
      if (!val) { setState("error"); return; }
      setSrc(val);
      if (isImage) setState("open");
      else { triggerDownload(val); setState("idle"); }
    } catch (err) {
      setState("error");
    }
  }
  function triggerDownload(dataUrl) {
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = downloadName || "archivo";
    a.click();
  }

  return (
    <>
      <button type="button" className="text-xs font-medium underline" style={{ color: "var(--brand)" }} onClick={open} disabled={state === "loading"}>
        {state === "loading" ? "Cargando…" : label}
      </button>
      {state === "error" && <span className="text-xs" style={{ color: "var(--bad)" }}>No se pudo cargar.</span>}
      {state === "open" && src && <ImageLightbox src={src} downloadName={downloadName} onClose={() => setState("idle")} />}
    </>
  );
}

function InvoiceSearchResultCard({ inv }) {

      {(inv.routeName || inv.driverName) && (
        <p className="text-xs" style={{ color: "var(--muted)" }}>{inv.routeName} · {inv.driverName}</p>

        <div className="min-w-0">
          <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>{invoiceLabel(inv)}</p>
          <p className="font-semibold truncate">{inv.cliente}</p>
          <p className="text-sm truncate" style={{ color: "var(--muted)" }}>
            <MapPin size={12} className="inline mr-1 -mt-0.5" />{inv.direccion}
          </p>
          {inv.destino && <p className="lg-mono text-xs mt-0.5" style={{ color: "var(--muted)" }}>Cód. {inv.destino}</p>}
        </div>
        <StatusPill status={inv.status} />
      </div>
      {inv.comment && (

}

function VentasView({ onExit }) {
  const [index, setIndex] = useState([]);
  const [searchEntries, setSearchEntries] = useState([]); // índice ligero de facturas, sin fotos
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [search, setSearch] = useState("");
  const [showPrevious, setShowPrevious] = useState(false);

  useEffect(() => {
    const unwatch = window.storage.watch(INDEX_KEY, (raw) => {
      setIndex(raw ? JSON.parse(raw) : []);
    });
    return unwatch;
  }, []);
  // El índice de búsqueda guarda solo texto (factura, pedido, cliente…),
  // nunca fotos, así que escucharlo completo en tiempo real es barato:
  // no baja más que unos cuantos KB, sin importar cuántas rutas existan.
  useEffect(() => {
    const unwatch = window.storage.watch(SEARCH_INDEX_KEY, (raw) => {
      setSearchEntries(raw ? Object.values(raw) : []);
    });
    return unwatch;
  }, []);
  // La ruta completa (con fotos) solo se descarga cuando el usuario
  // realmente la abre, nunca por adelantado.
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    const unwatch = window.storage.watch(`route:${selectedId}`, (raw) => {
      setRoute(raw ? JSON.parse(raw) : null);
    });
    return unwatch;
  }, [selectedId]);

  if (route) {
    return <RouteReadOnlyDetail route={route} onBack={() => setSelectedId(null)} />;
  }

  const query = search.trim().toLowerCase();
  let searchResults = null;
  if (query) {
    searchResults = searchEntries.filter((inv) => {
      const hay = [inv.factura, inv.pedido, inv.destino, inv.cliente].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(query);
    });
  }

  const todayRoutes = index.filter((r) => isToday(r.createdAt));
  const previousRoutes = index.filter((r) => !isToday(r.createdAt));
  const { dayGroups, weekGroups } = groupPreviousRoutes(previousRoutes);

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title="Representantes de venta" subtitle="Consulta de rutas y entregas" onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-6">
        <input
          className="lg-input"
          placeholder="Buscar por factura, pedido, cliente o código de cliente…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />

        {searchResults ? (
          <div>
            <h2 className="font-semibold mb-2">
              {searchResults.length} resultado{searchResults.length === 1 ? "" : "s"}
            </h2>
            <div className="flex flex-col gap-3">
              {searchResults.length === 0 && <EmptyState text="No se encontró ninguna factura con ese dato." />}
              {searchResults.map((inv) => (
                <div key={inv.id} className="cursor-pointer" onClick={() => setSelectedId(inv.routeId)}>
                  <InvoiceSearchResultCard inv={inv} />
                  <p className="text-xs text-right mt-1 mr-1" style={{ color: "var(--brand)" }}>Ver ruta completa y foto →</p>
                </div>
              ))}
            </div>
          </div>
        ) : (
          <div>
            <h2 className="font-semibold mb-2">Rutas de hoy</h2>
            <div className="flex flex-col gap-3">
              {todayRoutes.length === 0 && <EmptyState text="Sin rutas hoy todavía." />}
              {todayRoutes.map((r) => (
                <RouteRow key={r.id} r={r} onClick={() => setSelectedId(r.id)} />
              ))}
            </div>

            {previousRoutes.length > 0 && (
              <div className="mt-3">
                <button type="button" className="lg-btn lg-btn-ghost w-full" onClick={() => setShowPrevious((v) => !v)}>
                  {showPrevious ? "Ocultar" : "Mostrar"} rutas anteriores ({previousRoutes.length})
                </button>
                {showPrevious && (
                  <div className="flex flex-col gap-2.5 mt-3">
                    {dayGroups.map(([key, group]) => (
                      <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                    ))}
                    {weekGroups.map(([key, group]) => (
                      <CollapsibleRouteGroup key={key} label={group.label} routes={group.routes} onSelect={setSelectedId} />
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Raíz de la app                                                       */
/* ------------------------------------------------------------------ */

function LogisticaApp() {
  const [session, setSession] = useState(null); // { role, name }

  if (!session) {
    return <RoleGate onEnter={(role, name) => setSession({ role, name })} />;
  }
  if (session.role === "admin") {
    return <AdminView onExit={() => setSession(null)} />;
  }
  if (session.role === "liquidador") {
    return <LiquidadorView name={session.name} onExit={() => setSession(null)} />;
  }
  if (session.role === "ventas") {
    return <VentasView onExit={() => setSession(null)} />;
  }
  return <DriverView driverName={session.name} onExit={() => setSession(null)} />;
}


ReactDOM.render(<LogisticaApp />, document.getElementById("root"));
