    if (!window.storage) {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const root = db.ref("logistica-app");

      window.storage = {
        async get(key) {
          const snap = await root.child(key).once("value");
          const val = snap.val();
          return val === null || val === undefined ? null : { key, value: val, shared: true };
        },
        async set(key, value) {
          await root.child(key).set(value);
          return { key, value, shared: true };
        },
        async delete(key) {
          await root.child(key).remove();
          return { key, deleted: true, shared: true };
        },
        async list(p = "") {
          const snap = await root.once("value");
          const all = snap.val() || {};
          const keys = Object.keys(all).filter((k) => k.startsWith(p));
          return { keys, prefix: p, shared: true };
        },
      };

const INDEX_KEY = "routes-index";

async function getIndex() {
  try {
    const res = await window.storage.get(INDEX_KEY, true);
    return res ? JSON.parse(res.value) : [];
  } catch {
    return [];
  }
}
async function saveIndex(list) {
  try {
    await window.storage.set(INDEX_KEY, JSON.stringify(list), true);
  } catch {
    /* noop */
  }
}
async function getRoute(id) {
  try {
    const res = await window.storage.get(`route:${id}`, true);
    return res ? JSON.parse(res.value) : null;
  } catch {
    return null;
  }
}
async function saveRoute(route) {
  try {
    await window.storage.set(`route:${route.id}`, JSON.stringify(route), true);
  } catch {
    /* noop */
  }
}
function newId(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

/* Comprime una foto a base64 (máx 900px, jpeg 0.6) para no exceder límites */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Convierte un valor de celda de folio/factura a texto limpio (sin .0) */
function cleanFolio(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "number") return String(Math.trunc(v));
  return String(v).trim();
}

/* Busca una columna por nombre tolerando espacios extra / mayúsculas distintas */
function getField(row, name) {
  if (name in row) return row[name];
  const target = name.trim().toLowerCase();
  const key = Object.keys(row).find((k) => k.trim().toLowerCase() === target);
  return key ? row[key] : "";
}

/*
 * Lee un archivo .xlsx/.csv de rutas y lo agrupa por código de "Ruta".
 * Columnas esperadas (nombres tal cual el reporte de despacho):
 *   Ruta, Ruta Texto, Factura, Nombre destinatario de mercancías
 * Devuelve: [{ code, locality, invoices: [{folio, cliente, direccion}], skipped }]
 */
async function parseRoutesExcel(file) {
  const isCsv = /\.csv$/i.test(file.name);
  let wb;
  if (isCsv) {
    const text = await file.text();
    wb = XLSX.read(text, { type: "string" });
  } else {
    const buf = await file.arrayBuffer();
    wb = XLSX.read(new Uint8Array(buf), { type: "array" });
  }
  const sheetName = wb.SheetNames.includes("Hoja1") ? "Hoja1" : wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });

  const groups = new Map();
  let skipped = 0;

  for (const row of rows) {
    const code = String(getField(row, "Ruta") || "").trim();
    const folio = cleanFolio(getField(row, "Factura"));
    if (!code || !folio) { skipped++; continue; }

    const cliente = String(getField(row, "Nombre destinatario de mercancías") || "Sin nombre").trim();
    const locality = String(getField(row, "Ruta Texto") || "Sin localidad").trim();

    if (!groups.has(code)) groups.set(code, { code, locality, invoices: [] });
    const g = groups.get(code);
    g.invoices.push({ folio, cliente, direccion: locality || "Sin localidad" });
    if (!g.locality) g.locality = locality;
  }

  return { groups: Array.from(groups.values()), skipped, totalRows: rows.length };
}

/* Piezas visuales de estatus                                          */

const STATUS = {
  pendiente: { label: "Pendiente", bg: "var(--pend-bg)", fg: "var(--muted)", border: "var(--line)" },
  entregado: { label: "Entregado", bg: "var(--ok-bg)", fg: "var(--ok)", border: "var(--ok)" },
  fallido: { label: "No entregado", bg: "var(--bad-bg)", fg: "var(--bad)", border: "var(--bad)" },
};

function StatusPill({ status }) {
  const s = STATUS[status] || STATUS.pendiente;
  const Icon = status === "entregado" ? CheckCircle2 : status === "fallido" ? XCircle : Clock;
  return (
    <span
      style={{ background: s.bg, color: s.fg, border: `1.5px solid ${s.border}` }}
      className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full"
    >
      <Icon size={13} /> {s.label}
    </span>
  );
}

function ProgressBar({ invoices }) {
  const total = invoices.length || 1;
  const ok = invoices.filter((i) => i.status === "entregado").length;
  const bad = invoices.filter((i) => i.status === "fallido").length;
  const pend = invoices.length - ok - bad;
  return (
    <div>
      <div className="flex h-2.5 w-full rounded-full overflow-hidden" style={{ background: "var(--line)" }}>
        <div style={{ width: `${(ok / total) * 100}%`, background: "var(--ok)" }} />
        <div style={{ width: `${(bad / total) * 100}%`, background: "var(--bad)" }} />
      </div>
      <div className="flex gap-3 mt-1.5 text-xs" style={{ color: "var(--muted)" }}>
        <span>{ok} entregadas</span>
        <span>{bad} fallidas</span>
        <span>{pend} pendientes</span>
      </div>
    </div>
  );
}

function AdminView({ onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [showNewRoute, setShowNewRoute] = useState(false);
  const [showNewInvoice, setShowNewInvoice] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const pollRef = useRef(null);

  const refreshIndex = useCallback(async () => setIndex(await getIndex()), []);
  const refreshRoute = useCallback(async (id) => {
    if (!id) return;
    setRoute(await getRoute(id));
  }, []);

  useEffect(() => { refreshIndex(); }, [refreshIndex]);
  useEffect(() => {
    if (!selectedId) { setRoute(null); return; }
    refreshRoute(selectedId);
    pollRef.current = setInterval(() => refreshRoute(selectedId), 4000);
    return () => clearInterval(pollRef.current);
  }, [selectedId, refreshRoute]);

  async function createRoute(name, driverName) {
    const r = { id: newId("route"), name, driverName, createdAt: Date.now(), invoices: [] };
    await saveRoute(r);
    const next = [{ id: r.id, name, driverName, createdAt: r.createdAt }, ...index];
    await saveIndex(next);
    setIndex(next);
    setSelectedId(r.id);
    setShowNewRoute(false);
  }

  async function importRoutes(groupsWithDriver) {
    // groupsWithDriver: [{ code, locality, driverName, routeName, invoices }]
    const newRoutesMeta = [];
    for (const g of groupsWithDriver) {
      const route = {
        id: newId("route"),
        name: g.routeName,
        driverName: g.driverName,
        createdAt: Date.now(),
        invoices: g.invoices.map((inv) => ({
          id: newId("inv"),
          folio: inv.folio,
          cliente: inv.cliente,
          direccion: inv.direccion,
          status: "pendiente",
          photo: null,
          comment: null,
          updatedAt: Date.now(),
        })),
      };
      await saveRoute(route);
      newRoutesMeta.push({ id: route.id, name: route.name, driverName: route.driverName, createdAt: route.createdAt });
    }
    const next = [...newRoutesMeta, ...index];
    await saveIndex(next);
    setIndex(next);
    setShowImport(false);
  }

  async function addInvoice(folio, cliente, direccion) {
    if (!route) return;
    const inv = {
      id: newId("inv"), folio, cliente, direccion,
      status: "pendiente", photo: null, comment: null, updatedAt: Date.now(),
    };
    const updated = { ...route, invoices: [...route.invoices, inv] };
    await saveRoute(updated);
    setRoute(updated);
    setShowNewInvoice(false);
  }

  if (route) {
    return (
      <div className="lg-root min-h-screen">
        <GlobalStyle />
        <Header
          title={route.name}
          subtitle={`Asignada a ${route.driverName}`}
          onBack={() => setSelectedId(null)}
          dark
        />
        <div className="max-w-lg mx-auto px-4 py-5">
          <div className="lg-card p-4 mb-5">
            <ProgressBar invoices={route.invoices} />
          </div>

          <div className="flex items-center justify-between mb-3">
            <h2 className="font-semibold">Facturas ({route.invoices.length})</h2>
            <button className="lg-btn lg-btn-amber !py-2 !px-3 text-sm" onClick={() => setShowNewInvoice(true)}>
              <Plus size={16} /> Agregar
            </button>
          </div>

          <div className="flex flex-col gap-2.5">
            {route.invoices.length === 0 && (
              <EmptyState text="Todavía no hay facturas en esta ruta. Agrega la primera." />
            )}
            {route.invoices.map((inv) => (
              <div key={inv.id} className="lg-card p-3.5">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>#{inv.folio}</p>
                    <p className="font-semibold truncate">{inv.cliente}</p>
                    <p className="text-sm truncate" style={{ color: "var(--muted)" }}>
                      <MapPin size={12} className="inline mr-1 -mt-0.5" />{inv.direccion}
                    </p>
                  </div>
                  <StatusPill status={inv.status} />
                </div>
                {inv.status === "fallido" && inv.comment && (
                  <p className="text-sm mt-2 rounded-md p-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
                    <MessageSquare size={13} className="inline mr-1 -mt-0.5" />{inv.comment}
                  </p>
                )}
                {inv.status === "entregado" && inv.photo && (
                  <img src={inv.photo} alt="evidencia" className="mt-2 rounded-md w-full max-h-40 object-cover" />
                )}
              </div>
            ))}
          </div>
        </div>

        {showNewInvoice && (
          <InvoiceFormSheet onCancel={() => setShowNewInvoice(false)} onSave={addInvoice} />
        )}
      </div>
    );
  }

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title="Panel de despacho" subtitle="Rutas activas" onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5">
        <div className="flex gap-2.5 mb-5">
          <button className="lg-btn lg-btn-amber flex-1" onClick={() => setShowNewRoute(true)}>
            <Plus size={18} /> Nueva ruta
          </button>
          <button className="lg-btn lg-btn-ghost flex-1" onClick={() => setShowImport(true)}>
            <FileSpreadsheet size={18} /> Importar Excel
          </button>
        </div>

        <div className="flex flex-col gap-3">
          {index.length === 0 && <EmptyState text="Aún no has creado ninguna ruta." />}
          {index.map((r) => (
            <RouteRow key={r.id} r={r} onClick={() => setSelectedId(r.id)} />
          ))}
        </div>
      </div>

      {showNewRoute && (
        <NewRouteSheet onCancel={() => setShowNewRoute(false)} onSave={createRoute} />
      )}
      {showImport && (
        <ImportExcelSheet onCancel={() => setShowImport(false)} onImport={importRoutes} />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Importar rutas desde Excel                                          */
/* ------------------------------------------------------------------ */

function ImportExcelSheet({ onCancel, onImport }) {
  const [step, setStep] = useState("upload"); // upload | preview | error
  const [parsed, setParsed] = useState(null); // { groups, skipped, totalRows }
  const [assignments, setAssignments] = useState({}); // code -> { driverName, routeName }
  const [errorMsg, setErrorMsg] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    setErrorMsg("");
    try {
      const result = await parseRoutesExcel(file);
      if (result.groups.length === 0) {
        setErrorMsg("No se encontraron filas con Ruta y Factura válidas en el archivo.");
        setStep("error");
      } else {
        setParsed(result);
        const initial = {};
        result.groups.forEach((g) => {
          initial[g.code] = { driverName: "", routeName: `${g.code} — ${g.locality}` };
        });
        setAssignments(initial);
        setStep("preview");
      }
    } catch (err) {
      setErrorMsg(`No se pudo leer el archivo: ${err?.message || "error desconocido"}. Verifica que sea un .xlsx o .csv válido.`);
      setStep("error");
    } finally {
      setBusy(false);
    }
  }

  function updateAssignment(code, field, value) {
    setAssignments((prev) => ({ ...prev, [code]: { ...prev[code], [field]: value } }));
  }

  const allAssigned = parsed?.groups.every((g) => assignments[g.code]?.driverName?.trim());

  function confirmImport() {
    const groupsWithDriver = parsed.groups.map((g) => ({
      code: g.code,
      locality: g.locality,
      invoices: g.invoices,
      driverName: assignments[g.code].driverName.trim(),
      routeName: assignments[g.code].routeName.trim() || `${g.code} — ${g.locality}`,
    }));
    onImport(groupsWithDriver);
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 560 }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Importar rutas desde Excel</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>

        {step === "upload" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Sube el reporte de despacho (.xlsx o .csv). Se usan las columnas
              <span className="lg-mono"> Ruta</span>, <span className="lg-mono">Ruta Texto</span>,
              <span className="lg-mono"> Factura</span> y{" "}
              <span className="lg-mono">Nombre destinatario de mercancías</span>. Cada código de
              Ruta se agrupa como una ruta nueva; la localidad se usa como dirección temporal.
            </p>
            <label className="lg-card flex flex-col items-center justify-center gap-2 py-9 cursor-pointer" style={{ borderStyle: "dashed" }}>
              <Upload size={26} style={{ color: "var(--muted)" }} />
              <span className="text-sm font-medium">{busy ? "Leyendo archivo…" : "Seleccionar archivo"}</span>
              <input type="file" accept=".xlsx,.xls,.csv" className="lg-file-input" onChange={handleFile} disabled={busy} />
            </label>
          </div>
        )}

        {step === "error" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm rounded-md p-3 flex items-start gap-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
              <AlertTriangle size={16} className="mt-0.5 shrink-0" /> {errorMsg}
            </p>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Intentar de nuevo</button>
          </div>
        )}

        {step === "preview" && parsed && (
          <div className="flex flex-col gap-4">
            <p className="text-sm" style={{ color: "var(--muted)" }}>
              Se encontraron <b>{parsed.groups.reduce((a, g) => a + g.invoices.length, 0)}</b> facturas
              en <b>{parsed.groups.length}</b> rutas
              {parsed.skipped > 0 && <> · {parsed.skipped} filas se omitieron por no tener Ruta o Factura</>}.
              Asigna un chofer a cada ruta para poder importarlas.
            </p>

            <div className="flex flex-col gap-3 max-h-[45vh] overflow-y-auto pr-0.5">
              {parsed.groups.map((g) => (
                <div key={g.code} className="lg-card p-3.5">
                  <div className="flex items-center justify-between mb-2">
                    <span className="lg-mono text-sm font-semibold">{g.code}</span>
                    <span className="text-xs" style={{ color: "var(--muted)" }}>{g.invoices.length} facturas</span>
                  </div>
                  <input
                    className="lg-input mb-2 text-sm"
                    value={assignments[g.code]?.routeName || ""}
                    onChange={(e) => updateAssignment(g.code, "routeName", e.target.value)}
                    placeholder="Nombre de la ruta"
                  />
                  <input
                    className="lg-input text-sm"
                    value={assignments[g.code]?.driverName || ""}
                    onChange={(e) => updateAssignment(g.code, "driverName", e.target.value)}
                    placeholder="Nombre del chofer (obligatorio)"
                  />
                </div>
              ))}
            </div>

            <button className="lg-btn lg-btn-amber" disabled={!allAssigned} onClick={confirmImport}>
              Importar {parsed.groups.length} ruta{parsed.groups.length === 1 ? "" : "s"}
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={() => setStep("upload")}>Elegir otro archivo</button>
          </div>
        )}
      </div>
    </div>
  );
}

function RouteRow({ r, onClick }) {
  const [live, setLive] = useState(null);
  useEffect(() => { getRoute(r.id).then(setLive); }, [r.id]);
  const invoices = live?.invoices || [];
  return (
    <button onClick={onClick} className="lg-card p-4 text-left w-full">
      <div className="flex items-center justify-between mb-2">
        <p className="font-semibold">{r.name}</p>
        <span className="text-xs flex items-center gap-1" style={{ color: "var(--muted)" }}>
          <User size={12} /> {r.driverName}
        </span>
      </div>
      <ProgressBar invoices={invoices.length ? invoices : [{ status: "pendiente" }]} />
    </button>
  );
}

function Header({ title, subtitle, onBack, dark }) {
  return (
    <div style={{ background: dark ? "var(--asphalt)" : "transparent" }} className="px-4 pt-6 pb-5">
      <div className="max-w-lg mx-auto flex items-center gap-3">
        {onBack && (
          <button onClick={onBack} className="text-white/90" style={{ marginLeft: -6 }}>
            <ChevronLeft size={24} />
          </button>
        )}
        <div>
          <h1 className="text-white font-semibold text-lg leading-tight">{title}</h1>
          {subtitle && <p className="text-xs" style={{ color: "#9CA3AF" }}>{subtitle}</p>}
        </div>
      </div>
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div className="lg-card p-6 text-center" style={{ color: "var(--muted)" }}>
      <Package size={26} className="mx-auto mb-2" />
      <p className="text-sm">{text}</p>
    </div>
  );
}

function NewRouteSheet({ onCancel, onSave }) {
  const [name, setName] = useState("");
  const [driver, setDriver] = useState("");
  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Nueva ruta</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>
        <div className="flex flex-col gap-3">
          <div>
            <label className="text-sm font-medium">Nombre de la ruta</label>
            <input className="lg-input mt-1" placeholder="Ej. Ruta Norte — Martes" value={name} onChange={(e) => setName(e.target.value)} />
          </div>
          <div>
            <label className="text-sm font-medium">Asignar a chofer</label>
            <input className="lg-input mt-1" placeholder="Nombre del chofer" value={driver} onChange={(e) => setDriver(e.target.value)} />
          </div>
          <button
            className="lg-btn lg-btn-amber mt-2"
            disabled={!name.trim() || !driver.trim()}
            onClick={() => onSave(name.trim(), driver.trim())}
          >
            Crear ruta
          </button>
        </div>
      </div>
    </div>
  );
}

function InvoiceFormSheet({ onCancel, onSave }) {
  const [folio, setFolio] = useState("");
  const [cliente, setCliente] = useState("");
  const [direccion, setDireccion] = useState("");
  const valid = folio.trim() && cliente.trim() && direccion.trim();
  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">Agregar factura</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>
        <div className="flex flex-col gap-3">
          <div>
            <label className="text-sm font-medium">Folio</label>
            <input className="lg-input mt-1 lg-mono" placeholder="F-00123" value={folio} onChange={(e) => setFolio(e.target.value)} />
          </div>
          <div>
            <label className="text-sm font-medium">Cliente</label>
            <input className="lg-input mt-1" placeholder="Nombre del cliente" value={cliente} onChange={(e) => setCliente(e.target.value)} />
          </div>
          <div>
            <label className="text-sm font-medium">Dirección</label>
            <input className="lg-input mt-1" placeholder="Calle, número, colonia" value={direccion} onChange={(e) => setDireccion(e.target.value)} />
          </div>
          <button className="lg-btn lg-btn-amber mt-2" disabled={!valid} onClick={() => onSave(folio.trim(), cliente.trim(), direccion.trim())}>
            Agregar a la ruta
          </button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Vista Chofer                                                         */
/* ------------------------------------------------------------------ */

function DriverView({ driverName, onExit }) {
  const [index, setIndex] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [route, setRoute] = useState(null);
  const [activeInvoice, setActiveInvoice] = useState(null); // {invoice, action}
  const pollRef = useRef(null);

  const myRoutes = index.filter(
    (r) => r.driverName.trim().toLowerCase() === driverName.trim().toLowerCase()
  );

  useEffect(() => { getIndex().then(setIndex); }, []);
  useEffect(() => {
    if (!selectedId) return;
    const load = () => getRoute(selectedId).then(setRoute);
    load();
    pollRef.current = setInterval(load, 4000);
    return () => clearInterval(pollRef.current);
  }, [selectedId]);

  // auto-select single route
  useEffect(() => {
    if (!selectedId && myRoutes.length === 1) setSelectedId(myRoutes[0].id);
  }, [myRoutes, selectedId]);

  async function submitStatus(invoiceId, status, extra) {
    const updated = {
      ...route,
      invoices: route.invoices.map((inv) =>
        inv.id === invoiceId ? { ...inv, status, ...extra, updatedAt: Date.now() } : inv
      ),
    };
    await saveRoute(updated);
    setRoute(updated);
    setActiveInvoice(null);
  }

  if (route) {
    return (
      <div className="lg-root min-h-screen">
        <GlobalStyle />
        <Header title={route.name} subtitle={`${route.invoices.length} entregas`} onBack={() => (myRoutes.length > 1 ? setSelectedId(null) : onExit())} dark />
        <div className="max-w-lg mx-auto px-4 py-5">
          <div className="lg-card p-4 mb-5">
            <ProgressBar invoices={route.invoices} />
          </div>

          <div className="flex flex-col gap-3">
            {route.invoices.length === 0 && <EmptyState text="Despacho aún no agrega facturas a tu ruta." />}
            {route.invoices.map((inv) => (
              <button
                key={inv.id}
                onClick={() => setActiveInvoice(inv)}
                className="lg-card p-4 text-left w-full active:scale-[0.99] transition-transform"
                style={{ borderLeft: `6px solid ${STATUS[inv.status].fg === "var(--muted)" ? "var(--line)" : STATUS[inv.status].fg}` }}
              >
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p className="lg-mono text-xs" style={{ color: "var(--muted)" }}>#{inv.folio}</p>
                    <p className="font-semibold text-base truncate">{inv.cliente}</p>
                    <p className="text-sm truncate" style={{ color: "var(--muted)" }}>
                      <MapPin size={12} className="inline mr-1 -mt-0.5" />{inv.direccion}
                    </p>
                  </div>
                  <StatusPill status={inv.status} />
                </div>
              </button>
            ))}
          </div>
        </div>

        {activeInvoice && (
          <InvoiceActionSheet
            invoice={activeInvoice}
            onCancel={() => setActiveInvoice(null)}
            onConfirm={submitStatus}
          />
        )}
      </div>
    );
  }

  return (
    <div className="lg-root min-h-screen">
      <GlobalStyle />
      <Header title={`Hola, ${driverName}`} subtitle="Tus rutas de hoy" onBack={onExit} dark />
      <div className="max-w-lg mx-auto px-4 py-5 flex flex-col gap-3">
        {myRoutes.length === 0 && <EmptyState text="Todavía no tienes rutas asignadas. Pide a despacho que te asigne una." />}
        {myRoutes.map((r) => (
          <button key={r.id} onClick={() => setSelectedId(r.id)} className="lg-card p-4 text-left w-full flex items-center gap-3">
            <div className="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--amber)" }}>
              <Truck size={20} color="#191B1F" />
            </div>
            <div className="min-w-0">
              <p className="font-semibold truncate">{r.name}</p>
              <p className="text-xs" style={{ color: "var(--muted)" }}>Toca para ver tus entregas</p>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function InvoiceActionSheet({ invoice, onCancel, onConfirm }) {
  const [mode, setMode] = useState(null); // 'entregado' | 'fallido'
  const [photo, setPhoto] = useState(invoice.photo || null);
  const [comment, setComment] = useState(invoice.comment || "");
  const [busy, setBusy] = useState(false);

  async function handlePhoto(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    try {
      setPhoto(await compressImage(file));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="lg-scrim" onClick={onCancel}>
      <div className="lg-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <h3 className="font-semibold text-lg">#{invoice.folio} · {invoice.cliente}</h3>
          <button onClick={onCancel}><X size={20} /></button>
        </div>
        <p className="text-sm mb-4" style={{ color: "var(--muted)" }}>{invoice.direccion}</p>

        {!mode && (
          <div className="flex flex-col gap-2.5">
            <button className="lg-btn lg-btn-ok !py-4 text-base" onClick={() => setMode("entregado")}>
              <CheckCircle2 size={20} /> Marcar como entregado
            </button>
            <button className="lg-btn lg-btn-bad !py-4 text-base" onClick={() => setMode("fallido")}>
              <XCircle size={20} /> No se pudo entregar
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={onCancel}>Cancelar</button>
          </div>
        )}

        {mode === "entregado" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm rounded-md p-2.5 flex items-start gap-2" style={{ background: "var(--ok-bg)", color: "var(--ok)" }}>
              <ShieldCheck size={16} className="mt-0.5 shrink-0" />
              Para cerrar la entrega, sube una foto de la factura firmada.
            </p>
            {photo ? (
              <img src={photo} alt="evidencia" className="rounded-lg w-full max-h-56 object-cover" />
            ) : (
              <label className="lg-card flex flex-col items-center justify-center gap-2 py-8 cursor-pointer" style={{ borderStyle: "dashed" }}>
                <Camera size={26} style={{ color: "var(--muted)" }} />
                <span className="text-sm font-medium">Tomar / subir foto</span>
                <input type="file" accept="image/*" capture="environment" className="lg-file-input" onChange={handlePhoto} />
              </label>
            )}
            {photo && (
              <label className="text-sm font-medium underline text-center cursor-pointer">
                Cambiar foto
                <input type="file" accept="image/*" capture="environment" className="lg-file-input" onChange={handlePhoto} />
              </label>
            )}
            <button
              className="lg-btn lg-btn-ok mt-1"
              disabled={!photo || busy}
              onClick={() => onConfirm(invoice.id, "entregado", { photo, comment: null })}
            >
              {busy ? "Procesando foto…" : "Confirmar entrega"}
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={() => setMode(null)}>Regresar</button>
          </div>
        )}

        {mode === "fallido" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm rounded-md p-2.5 flex items-start gap-2" style={{ background: "var(--bad-bg)", color: "var(--bad)" }}>
              <MessageSquare size={16} className="mt-0.5 shrink-0" />
              Explica el motivo para poder cerrar esta entrega.
            </p>
            <textarea
              className="lg-input"
              rows={4}
              placeholder="Ej. Local cerrado, no había quien recibiera…"
              value={comment}
              onChange={(e) => setComment(e.target.value)}
            />
            <button
              className="lg-btn lg-btn-bad mt-1"
              disabled={!comment.trim()}
              onClick={() => onConfirm(invoice.id, "fallido", { comment: comment.trim(), photo: null })}
            >
              Confirmar no entrega
            </button>
            <button className="lg-btn lg-btn-ghost" onClick={() => setMode(null)}>Regresar</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Raíz de la app                                                       */
/* ------------------------------------------------------------------ */

function LogisticaApp() {
  const [session, setSession] = useState(null); // { role, name }

  if (!session) {
    return <RoleGate onEnter={(role, name) => setSession({ role, name })} />;
  }
  if (session.role === "admin") {
    return <AdminView onExit={() => setSession(null)} />;
  }
  return <DriverView driverName={session.name} onExit={() => setSession(null)} />;
}


ReactDOM.render(<LogisticaApp />, document.getElementById("root"));
</script>
</body>
</html>
